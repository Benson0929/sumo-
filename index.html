<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUMO</title>
<style>
  html, body { margin: 0; height: 100%; background: #070b14; overflow: hidden;
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; color: #eee; }
  canvas { display: block; }
  #hint { position: fixed; left: 16px; top: 12px; font-size: 12px; opacity: .65; line-height: 1.7; max-width: 38vw; }
  #timer { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); font-size: 26px; font-weight: 700;
    font-variant-numeric: tabular-nums; letter-spacing: .05em; text-shadow: 0 0 8px #000; }
  #hud { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 70px; pointer-events: none; }
  .card { min-width: 200px; text-align: center; text-shadow: 0 0 10px #000, 0 0 3px #000;
    background: rgba(0,0,0,.62); border-radius: 6px; padding: 8px 14px 10px; }
  .card .name { font-size: 13px; letter-spacing: .2em; opacity: .85; }
  .card .name i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  /* 10 格量表：格數越多越容易被打飛 */
  .card .gauge { display: grid; grid-template-columns: repeat(12, 13px); gap: 4px 3px; justify-content: center; margin: 8px 0 6px; }
  .card .gauge span { width: 13px; height: 17px; box-sizing: border-box; border: 1px solid rgba(255,255,255,.5); background: rgba(0,0,0,.25); border-radius: 3px; transform: skewX(-12deg); }
  .card .gauge span.on { background: #f5b544; border-color: #f5b544; }
  .card .gauge span.on.full { background: #f0643a; border-color: #f0643a; }   /* 集滿的一欄：變紅、鎖定 */
  .card .gauge.danger span.on:not(.full) { animation: pulse .5s infinite alternate; }
  @keyframes pulse { to { opacity: .45; } }
  .card .wins span { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin: 0 4px; border: 2px solid #eee; box-sizing: border-box; }
  .card .wins span.won { background: #eee; }
  /* 道場的電影感：四周壓暗、偏冷 */
  #grade { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 75% 70% at 50% 52%, rgba(4,8,18,0) 55%, rgba(4,8,18,.55) 100%); }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .45s ease-out; }
  #vig { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .12s;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,.75) 100%); }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: #070b14; z-index: 50; transition: opacity .5s; letter-spacing: .3em; }
  #loading .t { font-size: 44px; font-weight: 800; }
  #loading .s { font-size: 13px; opacity: .7; }
  #loading .bar { width: 220px; height: 4px; background: rgba(255,255,255,.15); border-radius: 2px; overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 0; background: #d8261b; transition: width .3s; }
  #langBtn { position: fixed; left: 16px; bottom: 14px; z-index: 40; background: rgba(0,0,0,.55); color: #eee; border: 1px solid #444;
    border-radius: 6px; padding: 6px 12px; font-size: 12px; letter-spacing: .1em; cursor: pointer; }
  #langBtn:hover, #frameBtn:hover { border-color: #d8261b; }
  #frameBtn { position: fixed; left: 16px; bottom: 50px; z-index: 40; background: rgba(0,0,0,.55); color: #eee; border: 1px solid #444;
    border-radius: 4px; padding: 5px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  #tutBtn { position: fixed; left: 16px; bottom: 86px; z-index: 40; background: rgba(0,0,0,.55); color: #eee; border: 1px solid #444;
    border-radius: 4px; padding: 5px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  #tutBtn:hover { border-color: #d8261b; }
  /* 選角：左下角按鈕＋選角畫面（自己和對手各選一隻） */
  #pickBtn { position: fixed; left: 16px; bottom: 122px; z-index: 40; background: rgba(0,0,0,.55); color: #eee; border: 1px solid #444;
    border-radius: 4px; padding: 5px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  #pickBtn:hover { border-color: #d8261b; }
  #pick { display: none; position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.72); align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
  #pick.on { display: flex; }
  #pick .box { background: #161616; border: 1px solid #333; border-radius: 10px; padding: 20px 22px; width: min(560px, 100%); color: #eee; }
  #pick .ttl { font-size: 18px; font-weight: 700; letter-spacing: .1em; margin-bottom: 14px; }
  #pick .lab { font-size: 12px; opacity: .7; margin: 12px 0 6px; }
  #pick .opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  #pick .opts button { background: #262626; color: #eee; border: 1px solid #3a3a3a; border-radius: 6px; padding: 10px 4px; font: inherit; font-size: 13px; cursor: pointer; }
  #pick .opts button:hover { border-color: #888; }
  #pick .opts button.sel { background: #d8261b; border-color: #d8261b; color: #fff; font-weight: 700; }
  #pick .acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 18px; }
  #pick .acts button { background: #333; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 8px 14px; font: inherit; font-size: 13px; cursor: pointer; }
  #pick .acts button.go { background: #d8261b; border-color: #d8261b; color: #fff; font-weight: 700; }
  
  /* 教程卡片：畫面上方中央 */
  #tut { position: fixed; left: 50%; top: 58px; transform: translateX(-50%); z-index: 45; display: none; width: min(460px, 86vw);
    background: rgba(8,10,16,.78); border: 1px solid #3a3d47; border-radius: 12px; padding: 14px 18px 12px; text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,.45); transition: border-color .2s, box-shadow .2s; }
  #tut.on { display: block; }
  #tut.done { border-color: #46c47f; box-shadow: 0 0 0 1px #46c47f, 0 8px 30px rgba(0,0,0,.45); }
  #tut .tstep { font-size: 11px; letter-spacing: .18em; opacity: .6; }
  #tut .ttitle { font-size: 20px; font-weight: 700; margin: 4px 0 8px; letter-spacing: .04em; }
  #tut .tkeys { display: flex; gap: 6px; justify-content: center; align-items: center; flex-wrap: wrap; min-height: 34px; }
  #tut .tkeys kbd { display: inline-block; min-width: 30px; padding: 5px 9px; font: inherit; font-size: 14px; font-weight: 700; color: #fff;
    background: rgba(255,255,255,.08); border: 1px solid #8a8d98; border-bottom-width: 3px; border-radius: 7px; }
  #tut .tkeys kbd.lit { background: #d8261b; border-color: #ff7a6e; }
  #tut .tkeys span { font-size: 12px; opacity: .7; }
  #tut .tdesc { font-size: 13px; line-height: 1.6; opacity: .88; margin: 9px 0 10px; }
  #tut .tbar { height: 4px; background: rgba(255,255,255,.13); border-radius: 2px; overflow: hidden; }
  #tut .tbar i { display: block; height: 100%; width: 0; background: #d8261b; transition: width .08s linear; }
  #tut.done .tbar i { background: #46c47f; width: 100% !important; }
  #tut .tfoot { display: flex; justify-content: space-between; align-items: center; margin-top: 9px; font-size: 11px; }
  #tut .tok { color: #46c47f; font-weight: 700; letter-spacing: .1em; visibility: hidden; }
  #tut.done .tok { visibility: visible; }
  #tutSkip { background: none; color: #bbb; border: 1px solid #555; border-radius: 5px; padding: 3px 9px; font: inherit; font-size: 11px; cursor: pointer; }
  #tutSkip:hover { color: #fff; border-color: #d8261b; }
  /* 平台預覽模式（網址加 ?view=platform）：只留平台，其他介面都收起來 */
  body.viewonly #hud, body.viewonly #timer, body.viewonly #hint, body.viewonly #camRail, body.viewonly #tutBtn, body.viewonly #frameBtn, body.viewonly #pickBtn,
  body.viewonly #langBtn, body.viewonly #msg, body.viewonly #vig, body.viewonly #tut, body.viewonly #fps { display: none !important; }
  #viewHelp { display: none; position: fixed; left: 16px; top: 12px; z-index: 40; font-size: 12px; line-height: 1.8; opacity: .8; }
  body.viewonly #viewHelp { display: block; }
  body.charview { background: #fff; }
  body.charview #grade { display: none; }
  body.charview #viewHelp { color: #333; opacity: 1; }
  body.charview #viewHelp a { color: #222; background: rgba(255,255,255,.85); border-color: #c8c8c8; }
  #viewHelp a, #viewBtn, #charBtn { color: #eee; background: rgba(0,0,0,.55); border: 1px solid #444; border-radius: 4px; padding: 3px 9px; font: inherit; font-size: 11px; text-decoration: none; cursor: pointer; }
  #viewHelp a:hover, #viewBtn:hover, #charBtn:hover { border-color: #d8261b; }
  #framesOv { position: fixed; inset: 0; z-index: 90; display: none; background: rgba(4,6,12,.82); padding: 3vh 3vw; }
  #framesOv.on { display: block; }
  #framesOv iframe { width: 100%; height: 100%; border: 1px solid #2a3348; border-radius: 10px; background: #070b14; }
  #framesClose { position: absolute; top: calc(3vh + 12px); right: calc(3vw + 22px); z-index: 2; width: 36px; height: 36px; border-radius: 50%;
    background: #d8261b; color: #fff; border: 0; font-size: 18px; cursor: pointer; }
  #fps { position: fixed; right: 16px; bottom: 12px; font: 12px/1.4 ui-monospace, monospace; opacity: .7; text-align: right; pointer-events: none; }
  .card.clashing::after { content: attr(data-clash); display: block; font-size: 12px; letter-spacing: .15em; margin-top: 4px; animation: pulse .25s infinite alternate; }
  .card .gauge span.pend { animation: pulse .12s infinite alternate; background: #fff; border-color: #fff; }
  #msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 64px; font-weight: 800; letter-spacing: .1em; pointer-events: none; opacity: 0;
    transition: opacity .15s; text-shadow: 0 0 20px #000; text-align: center; white-space: pre-line; }
  #pause { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; pointer-events: none; text-shadow: 0 0 12px #000, 0 0 4px #000; }
  #pause.on { display: flex; }
  #pause .title { font-size: 56px; font-weight: 800; letter-spacing: .3em; }
  #pause .sub { font-size: 14px; opacity: .85; }
  #camRail { position: fixed; left: 16px; top: 50%; transform: translateY(-50%); width: 56px;
    display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 0;
    background: rgba(20,20,20,.85); border: 1px solid #333; border-radius: 8px; font-size: 11px; user-select: none; }
  #camRail .cap { opacity: .7; }
  #camRail button { width: 32px; height: 26px; background: #333; color: #eee; border: 0; border-radius: 4px;
    cursor: pointer; font-size: 11px; touch-action: none; }
  #camRail button:active { background: #d8261b; }
  #camRail .track { position: relative; width: 8px; height: min(260px, 40vh); background: #333; border-radius: 4px;
    cursor: ns-resize; touch-action: none; }
  #camRail .track::before { content: ''; position: absolute; inset: 0 -14px; }
  #camRail .fill { position: absolute; left: 0; right: 0; bottom: 0; background: #d8261b; border-radius: 4px; }
  #camRail .thumb { position: absolute; left: 50%; width: 22px; height: 18px; margin-left: -11px; background: #eee;
    border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.6); }
  #camRail .val { font-variant-numeric: tabular-nums; opacity: .85; }
  #panel { position: fixed; top: 16px; right: 16px; width: 240px; max-height: calc(100% - 32px); overflow-y: auto;
    background: rgba(20,20,20,.85); border: 1px solid #333; border-radius: 8px; padding: 12px 14px; font-size: 12px; box-sizing: border-box; }
  #panel h3 { margin: 0 0 8px; font-size: 13px; display: flex; justify-content: space-between; }
  #keysHelp { font-size: 11px; line-height: 1.75; opacity: .85; margin-bottom: 6px; }
  #keysHelp b { color: #fff; font-weight: 600; }
  #panel h4 { margin: 12px 0 4px; font-size: 11px; opacity: .6; font-weight: 500; }
  #panel button { background: #333; color: #eee; border: 0; border-radius: 4px; padding: 2px 8px; cursor: pointer; font-size: 11px; }
  .row { margin: 6px 0; }
  .row label { display: flex; justify-content: space-between; }
  .row input { width: 100%; accent-color: #d8261b; }
  .camBtns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0 4px; }
  #panel .camBtns button { padding: 6px 0; font-size: 12px; user-select: none; touch-action: none; }
  #panel .camBtns button:active { background: #d8261b; }
  #panel.hidden .body { display: none; }
  /* 朋友測試版（<body data-build="public">）：藏起開發用的面板、鏡頭軌、FPS；按 H 仍可打開面板 */
  body[data-build="public"] #panel:not(.open), body[data-build="public"] #camRail { display: none; }
</style>
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                 "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body data-build="public">
<div id="timer">0 － 0</div>
<div id="hud">
  <div class="card" id="card0">
    <div class="name"><i style="background:#e8a07a"></i><span data-i18n="you">你</span></div>
    <div class="gauge"></div>
    <div class="wins"></div>
  </div>
  <div class="card" id="card1">
    <div class="name"><i style="background:#5b82c0"></i>CPU</div>
    <div class="gauge"></div>
    <div class="wins"></div>
  </div>
</div>
<div id="hint" data-i18n="hint"></div>
<div id="grade"></div>
<div id="vig"></div>
<div id="flash"></div>
<div id="msg"></div>
<div id="viewHelp"><b>平台預覽</b><br>左鍵拖曳：旋轉　·　滾輪：縮放　·　右鍵拖曳：平移<br>H：開關調整面板　　<a id="viewBack" href="#">回到遊戲</a></div>
<div id="fps"></div>
<button id="langBtn" title="Language / 語言">EN</button>
<button id="frameBtn" title="T" data-i18n="frameBtn"></button>
<button id="tutBtn" data-i18n="tutBtn"></button>
<button id="pickBtn" data-i18n="pickBtn"></button>
<div id="pick"><div class="box">
  <div class="ttl" data-i18n="pickTitle"></div>
  <div class="lab" data-i18n="pickYou"></div><div class="opts" data-side="char"></div>
  <div class="lab" data-i18n="pickFoe"></div><div class="opts" data-side="foe"></div>
  <div class="acts"><button id="pickCancel" data-i18n="pickCancel"></button><button id="pickView" data-i18n="pickView"></button><button id="pickGo" class="go" data-i18n="pickGo"></button></div>
</div></div>
<div id="tut">
  <div class="tstep"></div>
  <div class="ttitle"></div>
  <div class="tkeys"></div>
  <div class="tdesc"></div>
  <div class="tbar"><i></i></div>
  <div class="tfoot"><span class="tok" data-i18n="tutOk"></span><button id="tutSkip" data-i18n="tutSkip"></button></div>
</div>
<div id="framesOv"><button id="framesClose" title="Esc">✕</button><iframe id="framesFrame" title="Frame Data"></iframe></div>
<div id="loading"><div class="t">SUMO</div><div class="bar"><i></i></div><div class="s" data-i18n="loading">載入中…</div></div>
<div id="camRail" title="鏡頭高度：拖動、滾輪或按住 ▲▼（Q / E）">
  <div class="cap">鏡頭高度</div>
  <button data-d="1">▲</button>
  <div class="track"><div class="fill"></div><div class="thumb"></div></div>
  <button data-d="-1">▼</button>
  <div class="val" id="camYVal"></div>
</div>
<div id="pause">
  <div class="title" data-i18n="paused">暫停</div>
  <div class="sub" data-i18n="resume">按 P 或 Esc 繼續</div>
</div>
<div id="panel" class="hidden">
  <h3>調整 <span><button id="viewBtn">平台預覽</button> <button id="charBtn">角色預覽</button> <button id="resetParams">預設值</button></span></h3>
  <div class="body"><h4 data-i18n="keysTitle"></h4><div id="keysHelp" data-i18n="hintKeys"></div><div id="sliders"></div></div>
</div>

import * as THREE from 'three';

    c.mx = tcx; c.mz = tcz;
    if (me.hitstun <= 0 && !me.move) {
      c.think -= dt;
      if (c.think <= 0) {
        c.think = 0.06 + (1 - s) * 0.25 + e * 0.25;      // 新手等級：回場的反應比較慢
        if (!me.specUsed && me.vy < 0 && (k > 1.2 || me.y < -0.8)) c.press('jump');   // 空中按跳躍 = 上升技
      }
    }
    return;
  }
  if (o.dead > 0 || o.out) { if (cl > 2) { c.mx = tcx; c.mz = tcz; } return; }

  const dx = o.x - me.x, dz = o.z - me.z, d = Math.hypot(dx, dz) || 1, ux = dx / d, uz = dz / d;
  const om = o.move;

  // 剋制循環：對手蓄力 → 翻滾到他背後；對手翻滾剛結束 → 用 D 反擊；對手在 D 距離外起手重擊 → 先用 D 戳
  if (om && om.id === 'strong' && (om.phase === 'charge' || (om.phase === 'startup' && om.pt > 0.08)) && om !== c.dodged && d < 3 && me.ground && me.hitstun <= 0 && (!me.move || me.move.phase === 'recovery')) {
    c.dodged = om;
    if (Math.random() < (0.15 + 0.7 * s) * (1 - e)) { c.roll = { x: ux, z: uz, t: 0.08 }; c.press('roll'); }   // 看到蓄力：滾到背後
  }
  if (o.roll === null && o.lag > 0.05 && d < 1.9 && me.ground && !me.move && me.hitstun <= 0 && Math.random() < (0.1 + 0.4 * s) * (1 - e)) { c.press('atk'); c.jabs = 2; }
  if (om && om.id === 'strong' && om.phase === 'startup' && d < 1.85 && d > 1.2 && me.ground && !me.move && me.hitstun <= 0 && Math.random() < (0.05 + 0.25 * s) * (1 - e)) { c.press('atk'); c.jabs = 0; }
  // 被 D 的前兩段打中：依等級在空檔翻滾逃開
  if (om && (om.id === 'jab1' || om.id === 'jab2') && om.hit && om !== c.escaped && me.hitstun > 0) {
    c.escaped = om;
    if (Math.random() < (0.15 + 0.6 * s) * (1 - e)) { const behind = Math.random() < 0.4 ? 1 : -1; c.roll = { x: ux * behind, z: uz * behind, t: 0.12 }; c.press('roll', 0.3); }
  }
  // 看到對手出招：依等級決定是否後退或跳開
  if (om && om !== c.seen && om.phase !== 'recovery' && om.id !== 'strong') {
    c.seen = om;
    if (d < 2.6 && me.ground && !me.move && me.hitstun <= 0) {
      const r = Math.random() + e;       // 新手等級：看到對手出招不會閃
      if (r < 0.05 + 0.3 * s) { c.press('jump'); c.roll = { x: -ux, z: -uz, t: 0.3 }; }
      else if (r < 0.1 + 0.45 * s) {     // 翻滾：多半往後，偶爾滾到對手背後
        const behind = Math.random() < 0.3 ? 1 : -1;
        c.roll = { x: ux * behind, z: uz * behind, t: 0.1 }; c.press('roll');
      }
      else if (r < 0.1 + 0.6 * s) c.roll = { x: -ux, z: -uz, t: 0.25 };
    }
  }
  if (c.roll) { c.roll.t -= dt; c.mx = c.roll.x; c.mz = c.roll.z; if (c.roll.t <= 0) c.roll = null; return; }
  if (c.shieldT > 0) { c.mx = c.mz = 0; return; }                              // 防禦中：站穩，不做其他決定
  if (c.airAtk > 0) { c.airAtk -= dt; if (c.airAtk <= 0 && !me.ground) c.press('atk'); }
  if (c.airSlam > 0) { c.airSlam -= dt; if (c.airSlam <= 0 && !me.ground) c.press('strong'); }

  const oOff = o.ledge || (!o.ground && (rhombus(o.x, o.z) > 1 || o.y < 0));
  const canDecide = me.ground && !me.move && me.hitstun <= 0 && me.lag <= 0 && me.dizzy <= 0 && !me.parry;
  // 彈反（等級 PARRY_CPU 以上）：對手出了彈得掉的招、快打到時按；等級越高越常彈。對手按住蓄力重擊時只能用猜的，常常會被騙
  if (P.cpuLevel >= PARRY_CPU && canDecide && o.move && o.move.def.dmg && !PARRY_SKIP.has(o.move.id) && Math.hypot(o.x - me.x, o.z - me.z) < o.move.def.reach * sz(o) + BODY_R * sz(me) + 0.7) {
    const m = o.move, chance = 0.15 + 0.5 * (P.cpuLevel - PARRY_CPU) / (9 - PARRY_CPU);
    if (m.phase === 'startup' && m.def.startup - m.pt <= 0.11 && c.parrySeen !== m.uid) {
      c.parrySeen = m.uid;
      if (Math.random() < chance) { c.press('parry'); c.mx = c.mz = 0; return; }
    } else if (m.phase === 'charge' && m.pt > 0.25 && c.parryGuess !== m.uid && Math.random() < dt * 0.6) {
      c.parryGuess = m.uid;
      if (Math.random() < chance) { c.press('parry'); c.mx = c.mz = 0; return; }
    }
  }

  if (oOff) {                            // 守邊：站在對手要回來的邊緣內側
    const E = edgeInfo(o.x, o.z);
    const tx = E.px - E.nx * 1.3, tz = E.pz - E.nz * 1.3;
    const ex = tx - me.x, ez = tz - me.z, el = Math.hypot(ex, ez);
    if (el > 0.4) { c.mx = ex / el; c.mz = ez / el; }
    c.think -= dt;
    // 對手掛在邊緣：跳起來用下墜重擊把他震下去
    if (canDecide && c.think <= 0 && d > 5 && edgeDist(me.x, me.z) > 2.5 && Math.random() < 0.06) { c.think = 1; c.press('taunt'); return; }   // 對手離很遠：偶爾嘲諷
    if (canDecide && c.think <= 0 && o.ledge && !o.ledge.climb && Math.hypot(o.ledge.hx - me.x, o.ledge.hz - me.z) < 1.9 && Math.random() < (0.25 + 0.5 * s) * (1 - e)) {
      c.think = 0.9; c.press('jump'); c.airSlam = 0.2; c.mx = c.mz = 0;
      return;
    }
    if (canDecide && c.think <= 0 && d < 1.8 && Math.abs(o.y - me.y) < 1.3 && !isInvuln(o) && !o.ledge) {
      c.think = 0.2 + (1 - s) * 0.4 + e * 0.7;
      if (Math.random() < 0.55 * e) return;                                     // 新手等級：守邊時常常只是站著
      if (Math.random() < 0.4 + 0.3 * s) { c.press('strong'); c.chargeT = 0.05; } else { c.press('atk'); c.jabs = e > 0.4 ? 0 : 2; }
    }
    return;
  }

  // 自己在塌陷中的角附近：先離開
  for (const cc of corners) if (cc.down > 0 && cornerW(cc, me.x, me.z) > 0.2) { c.mx = -cc.dx; c.mz = -cc.dz; return; }
  // 一般對峙：接近到出手距離，太近就退
  const walk = 1 - 0.3 * e;             // 新手等級：走得比較慢
  if (d > 1.4) { c.mx = ux * walk; c.mz = uz * walk; } else if (d < 0.7) { c.mx = -ux * walk; c.mz = -uz * walk; }
  if (edgeDist(me.x, me.z) < 1.0) {       // 自己靠近邊緣：往中心靠
    c.mx += tcx * 0.9; c.mz += tcz * 0.9;
    const l = Math.hypot(c.mx, c.mz) || 1; c.mx /= l; c.mz /= l;
  }
  // 連段：打中了就繼續按
  if (me.move && me.move.id.startsWith('jab') && me.move.hit && c.jabs > 0 && !(c.buf.atk > 0)) { c.press('atk'); c.jabs--; }

  c.think -= dt;
  if (!canDecide || c.think > 0) return;
  c.think = 0.1 + (1 - s) * 0.45 + Math.random() * 0.15 + e * (0.3 + Math.random() * 0.35);   // 新手等級：想比較久才出手
  if (Math.random() < 0.22 * e) return;   // 新手等級：有時候想完也不出手
  const combo = e > 0.4 ? (Math.random() < 0.6 ? 0 : 1) : 2;   // 輕拳連段會接幾下：新手等級通常只打一、兩下，不常打完三段
  const vuln = o.dizzy > 0 || (om && om.phase === 'recovery') || o.lag > 0.1;
  const r = Math.random();
  if (d < 1.85 && Math.abs(o.y - me.y) < 1.0) {
    const nearHot = corners.some(cc => (cc.down > 0 || cc.p > 35) && cornerW(cc, o.x, o.z) > 0.25);
    if (o.shielding) { c.press('atk'); c.jabs = combo; return; }                    // 對手防禦：用 D 打穿
    const finish = gaugeRow(o) >= 1;                                                    // 高 % 才用重擊收尾
    if (nearHot && r < (0.3 + 0.5 * s) * (1 - e)) { c.press('strong'); c.chargeT = 0.85 + Math.random() * 0.35; }   // 對手在快塌的角：蓄力過半的重擊（按住時間含 0.16 秒起手）
    else if (vuln && d < 1.4 && r < (0.4 + 0.4 * s) * (1 - e)) { c.press(finish ? 'strong' : 'atk'); c.chargeT = 0.05; c.jabs = 2; }   // 對手有破綻：懲罰
    else if (finish && d < 1.4 && r < 0.45 * (1 - 0.6 * e)) { c.press('strong'); c.chargeT = e > 0.4 ? 0.05 : Math.random() < 0.4 ? 0.95 : 0.1; }   // 新手等級：不蓄力
    else if (r < 0.75) { c.press('atk'); c.jabs = combo; }                        // 平常用輕拳累積傷害
    else if (r < 0.82) { c.press('strong'); c.chargeT = e > 0.4 ? 0.05 : Math.random() < 0.35 ? 2.05 : 0.95; }   // 偶爾蓄力硬吃（新手等級不蓄力，所以沒有霸體）
    else c.roll = { x: -ux, z: -uz, t: 0.3 };                                    // 偶爾後退拉開距離
  } else if (d > 2 && d < 4 && r < 0.35 * (1 - 0.7 * e)) {
    c.lungeDir = { x: ux, z: uz }; c.press('lunge');   // 中距離：朝對手突進
  } else if (!o.ground && d < 2.4 && o.y > 0.8 && r < 0.3 + 0.4 * s) {
    c.press('jump'); c.airAtk = 0.18;     // 對手在空中：跳起來追打
  }
}

// =====================================================================
// 物理與戰鬥
// =====================================================================
const tilt = { x: 0, z: 0, vx: 0, vz: 0, y: 0, vy: 0 };   // y：平台整體下沉量
const clampV = (v, lim) => Math.max(-lim, Math.min(lim, v));
let hitStop = 0, shake = 0, slowT = 0;
// 擊飛的鏡頭晃動：擊飛力道越大（飛得越遠），晃得越大、越久。對手成立的欄越多，力道會跳一級，所以第三欄被打飛明顯比第一欄晃得厲害
//   QUAKE.from：力道低於這個值不額外晃（輕拳、小擊退）；QUAKE.full：到這個值就是最大晃動
const QUAKE = { from: 4, full: 31, min: 0.12, max: 1.5, durMin: 0.22, durMax: 0.75, roll: 0.03 };
const quake = { a: 0, t: 0, dur: 0.3, k: 0, ph: [0, 0, 0] };
function launchQuake(kb) {
  const k = Math.max(0, Math.min(1, (kb - QUAKE.from) / (QUAKE.full - QUAKE.from)));
  if (k <= 0) return;
  const a = QUAKE.min + (QUAKE.max - QUAKE.min) * Math.pow(k, 1.25);
  if (a < quake.a * Math.max(0, 1 - quake.t / quake.dur)) return;      // 還在晃、而且比這次大：不蓋掉
  quake.a = a; quake.t = 0; quake.k = k; quake.dur = QUAKE.durMin + (QUAKE.durMax - QUAKE.durMin) * k;
  quake.ph = [Math.random() * 6.28, Math.random() * 6.28, Math.random() * 6.28];
}

function stepTilt(dt) {
  // 平常：依選手位置輕微傾斜；角落塌陷時再加上往那一角的大幅傾斜
  let mx = 0, mz = 0;
  for (const f of fighters) if (f.ground && f.dead <= 0 && !f.out) { mx += f.weight * f.x; mz += f.weight * f.z; }
  const col = collapseTilt();
  const targetZ = clampV(-P.tiltGain * mx, P.tiltMax) + col.tz;
  const targetX = clampV( P.tiltGain * mz, P.tiltMax) + col.tx;
  tilt.vz += (P.tiltStiff * (targetZ - tilt.z) - P.tiltDamp * tilt.vz) * dt;
  tilt.vx += (P.tiltStiff * (targetX - tilt.x) - P.tiltDamp * tilt.vx) * dt;
  tilt.vy += (P.tiltStiff * (col.ty - tilt.y) - P.tiltDamp * tilt.vy) * dt;
  tilt.z += tilt.vz * dt; tilt.x += tilt.vx * dt; tilt.y += tilt.vy * dt;
}
// 在 (x, z) 往下壓平台一下
function kickTilt(x, z, amt, cornerAmt = 0) {
  joltBearers(x, z, amt);                // 扛的人被震一下（膝蓋一軟再頂回來）
  tilt.vz += -P.landKick * x * amt;
  tilt.vx +=  P.landKick * z * amt;
  hurtBearers(x, z, cornerAmt);          // 角落壓力（站著、普通落地不算）
}

const isInvuln = f => f.invuln > 0 ||
  (f.roll && f.roll.t > 0.04 && f.roll.t < 0.27) ||
  (f.dodge && f.dodge.t > 0.03 && f.dodge.t < 0.3) ||
  (f.ledge && f.ledge.climb);

let moveSeq = 0;
function startMove(f, id) {
  const d = MOVES[id];
  f.move = { id, def: d, phase: 'startup', pt: 0, hit: false, charge: 0, queued: false, uid: ++moveSeq };
  if (id === 'slam') { f.vy = 2.5; f.vx *= 0.4; f.vz *= 0.4; }
  if (d.step && f.ground) { f.vx += Math.sin(f.yaw) * d.step; f.vz += Math.cos(f.yaw) * d.step; }
}
function enterActive(f, c) {
  const m = f.move, d = m.def;
  m.phase = 'active'; m.pt = 0;
  if (m.id === 'strong' && f.ground) {
    if (Math.hypot(c.mx, c.mz) > 0.3) f.yaw = Math.atan2(c.mx, c.mz);   // 不額外往前衝，保持「D 比 A 打得遠」
  }
  if (m.id === 'slam') { f.vy = d.plunge; f.vx = f.vz = 0; }
  if (m.id === 'upSpec') {
    f.ground = false; f.y = Math.max(f.y, 0.001); f.vy = d.rise; f.specUsed = true;
    f.vx = c.mx * 6.5; f.vz = c.mz * 6.5;   // 上升技可以帶比較多的水平距離，方便回場
  }
  if (m.id === 'strong') kickTilt(f.x, f.z, d.stomp * (1 + m.charge), m.charge * d.chargeMax >= armorCharge(d) ? 1 + m.charge : 0);   // 只有蓄到有霸體的重擊才算角落壓力
}
function releaseGrab(f) {
  if (f.opp.grabbedBy === f) f.opp.grabbedBy = null;
}
function stepMove(f, c, dt) {
  const m = f.move, d = m.def;
  m.pt += dt;
  if (m.id === 'taunt') {                 // 嘲諷：跳到放開 P（至少 min 秒），或整段跳完
    m.phase = 'active';
    const len = (rigAssets.clips.taunt ? rigAssets.clips.taunt.duration / (d.speed || 1) : 1.6) * (d.loops || 1) - 0.1;   // 按住 P 最多連續跳 loops 次
    if ((m.pt >= d.min && !c.tauntHeld) || m.pt >= len) { f.move = null; f.lag = 0.1; }
    return;
  }
  // A：起手和蓄力時可以用方向鍵轉向；出手的瞬間朝按著的方向打出去
  if (m.id === 'strong' && (m.phase === 'startup' || m.phase === 'charge') && f.ground && Math.hypot(c.mx, c.mz) > 0.3)
    turnTo(f, Math.atan2(c.mx, c.mz), 10, dt);
  if (m.phase === 'startup') {
    if (m.pt >= d.startup) {
      if (d.chargeMax && c.strongHeld) { m.phase = 'charge'; m.pt = 0; } else enterActive(f, c);
    }
  } else if (m.phase === 'charge') {
    m.charge = Math.min(1, m.pt / d.chargeMax);
    if (!c.strongHeld || m.pt >= d.chargeMax) enterActive(f, c);
  } else if (m.phase === 'active') {
    if (d.next && c.take('atk')) m.queued = true;
    if (m.id === 'slam') {
      if (f.ground) { m.phase = 'recovery'; m.pt = 0; shakeLedge(f); kickTilt(f.x, f.z, d.stomp, 1.2); shake = Math.max(shake, 0.3); puff(f.x, 0.1, f.z, { size: 0.5, life: 0.3, grow: 6, opacity: 0.5 }); }
    } else if (m.pt >= d.active) { m.phase = 'recovery'; m.pt = 0; }
  } else if (m.phase === 'recovery') {
    if (d.next && c.take('atk')) m.queued = true;
    if (m.pt >= (d.whiff && !m.hit ? d.whiff : d.recovery) + (m.extraLag || 0)) {     // 重擊打空、被防禦擋下：收招更久
      if (m.queued && d.next && f.ground) startMove(f, d.next);
      else f.move = null;
    }
  } else if (m.phase === 'hold') {       // 抓住對手：0.45 秒後往按的方向投出
    if (m.pt >= 0.45) {
      const t = f.opp;
      let dx = c.mx, dz = c.mz, l = Math.hypot(dx, dz);
      if (l < 0.3) { dx = Math.sin(f.yaw); dz = Math.cos(f.yaw); l = 1; }
      dx /= l; dz /= l;
      f.yaw = Math.atan2(dx, dz);
      f.move = { id: 'throwRec', def: { recovery: 0.28 }, phase: 'recovery', pt: 0, hit: true };
      if (t.grabbedBy === f) {
        t.grabbedBy = null;
        t.x = f.x + dx * 0.7; t.z = f.z + dz * 0.7; t.y = f.y + 0.3; t.ground = false;
        applyHit(f, t, MOVES.throw, dx, dz, 0);
      }
    }
  }
}

let ledgeClock = 1;   // 掛邊的計時用實際時間：遊戲放慢時，倒數條仍然是實際的 2 秒
// 有人掛在邊緣（還沒開始爬上來）
const someoneHanging = () => fighters.some(f => f.ledge && !f.ledge.climb && f.dead <= 0);
const armorCharge = d => Math.max(0, d.armorAt - d.startup);   // 霸體需要的蓄力時間（armorAt 從按下按鍵算起）
const isArmored = f => f.move && f.move.id === 'strong' && f.move.phase === 'charge' && f.move.pt >= armorCharge(f.move.def);
function applyHit(a, t, d, dirx, dirz, charge) {
  const dmg = (d.dmgMax ? d.dmg + (d.dmgMax - d.dmg) * charge : d.dmg) * P.dmgScale;
  const row = gaugeRow(t);               // 被打之前已經集滿幾欄（決定跨欄加成）
  addDamage(t, dmg);
  // 這一擊剛好把一欄集滿：不擊飛，進入連打對決（對手要在平台上才會觸發；在場外就先停在差一點集滿）
  if (t.locked < GAUGE_ROWS && t.pct >= (t.locked + 1) * ROW_PTS - 1e-6 && d !== MOVES.clashFinish) {
    if (game.state === 'play' && !game.clash && rhombus(t.x, t.z) < 0.96 && rhombus(a.x, a.z) <= 1 && !a.ledge) { startClash(a, t); return; }
    t.pct = (t.locked + 1) * ROW_PTS - 0.5;
  }
  if (d.light && isArmored(t)) {         // 蓄力過半的重擊：被 D 系列打中只受傷、不會被打斷
    hitStop = 0.05; shake = Math.max(shake, 0.12);
    spark((a.x + t.x) / 2, t.y + 1.1, (a.z + t.z) / 2, 2, 0xffd27a);
    return;
  }
  const kbg = d.kbgMax ? d.kbg + (d.kbgMax - d.kbg) * charge : d.kbg;
  // 跨欄加成（rowKB；輕拳一、二段以外的招式都有）：對手每集滿一欄，擊飛力道額外跳一級；rowKBCharge 是蓄滿時再多加的部分
  const rowKB = d.rowKB ? d.rowKB[row] + (d.rowKBCharge ? d.rowKBCharge[row] * charge : 0) : 0;
  let kb = (d.bkb + kbg * t.pct + rowKB) * P.kbScale / t.weight;
  // 順著平台下沉的方向打，飛得更遠；逆著打則較近
  const [skx, skz] = sinkAt(t.x, t.z);   // 被打向塌陷的角，飛得更遠
  const along = dirx * -Math.sin(tilt.z) + dirz * Math.sin(tilt.x) + (dirx * skx + dirz * skz) * 0.5;
  kb *= Math.max(0.7, Math.min(1.6, 1 + P.tiltKB * along));
  if (!Number.isFinite(kb)) { kb = 0; diag.pos++; }      // 防護：招式資料不完整時不會把無效數字帶進速度和畫面震動
  const ang = (d.angle || 0) * Math.PI / 180;
  t.vx = dirx * kb * Math.cos(ang); t.vz = dirz * kb * Math.cos(ang); t.vy = kb * Math.sin(ang);
  if (t.ground) { if (t.vy > 1.5) { t.ground = false; t.y = 0.02; } else t.vy = 0; }

    if (e.boneOf.length && t < 2) {                 // 還沒離開身體的點：跟著骨頭（身體的動作）移動；離開的那一刻帶著身體的速度
      for (const bn of e.boneOf) bn.updateMatrixWorld(true);

      platform.localToWorld(_kw.set(e.f.vx, e.f.vy, e.f.vz)).sub(platform.localToWorld(_kv.set(0, 0, 0)));
      let any = false;
      for (let j = 0; j < e.N; j++) {
        const id = e.bone[j]; if (id < 0) continue;
        const d = e.rel[j * 3 + 2];
        if (d < 0) continue;                         // 已經放開
        _kv.set(e.off[j * 3], e.off[j * 3 + 1], e.off[j * 3 + 2]).applyMatrix4(e.boneOf[id].matrixWorld);
        P3[j * 3] = _kv.x; P3[j * 3 + 1] = _kv.y; P3[j * 3 + 2] = _kv.z;
        if (t >= d) {                                // 這一格放開：加上身體當下的速度（一部分），之後由著色器飄散
          V3[j * 3] += _kw.x * 0.5; V3[j * 3 + 1] += _kw.y * 0.3; V3[j * 3 + 2] += _kw.z * 0.5;

      pos.needsUpdate = true; if (any) vel.needsUpdate = true;

}

function turnTo(f, target, rate, dt) {
  let dy = target - f.yaw;
  dy = Math.atan2(Math.sin(dy), Math.cos(dy));
  f.yaw += dy * Math.min(1, dt * rate);
}

function stepFighter(f, c, dt, active) {
  const o = f.opp;
  for (const k of ['invuln', 'lag', 'shieldStun', 'ledgeCd']) f[k] = Math.max(0, f[k] - dt);
  if (f.out) return;
  if (f.dead > 0) { if (f.ghost > 0) ghostStep(f, dt); f.dead -= dt; if (f.dead <= 0) respawn(f); return; }
  if (active) {                          // 量表恢復：一段時間沒被打中 → 慢慢減少，但集滿的欄不會減少
    f.calm += dt;
    if (f.calm > GAUGE_REST) {
      f.pct = Math.max(f.locked * ROW_PTS, f.pct - GAUGE_STEP / GAUGE_DECAY * dt);
    }
  }
  if (game.state === 'intro') {
    if (f.introDelay > 0) { f.introDelay -= dt; f.vy = 0; return; }   // 錯開一點點落下
    if (f.ground) f.introT += dt;
  }
  if (f.grabbedBy) {                     // 被抓住：固定在對方身前
    const g = f.grabbedBy;
    f.x = g.x + Math.sin(g.yaw) * 0.8; f.z = g.z + Math.cos(g.yaw) * 0.8; f.y = g.y + 0.15;
    f.vx = f.vz = f.vy = 0; f.yaw = g.yaw + Math.PI; f.ground = false;
    return;
  }

  // ---- 掛在邊緣 ----
  if (f.ledge) {
    const L = f.ledge;
    L.t += dt * (L.climb ? 1 : ledgeClock); f.vx = f.vz = f.vy = 0; f.yaw = Math.atan2(L.nx, L.nz);
    if (L.climb) {                       // 爬上平台（全程無敵）
      L.ct += dt;
      const dur = CLIMB_DUR[L.getup || 'up'];
      const p = Math.min(1, L.ct / dur), e = p * p * (3 - 2 * p);
      if (f.model) { f.x = L.hx; f.z = L.hz; f.y = LEDGE_Y; }    // 骨架人物：身體由爬上來的動作帶上去，結束時才移到平台上
      else { f.x = L.hx + (L.ix - L.hx) * e; f.z = L.hz + (L.iz - L.hz) * e; f.y = LEDGE_Y * (1 - Math.min(1, p * 1.6)); }
      if (p >= 1) {
        f.ledge = null; f.y = 0; f.ground = true; f.ledgeCount = 0;
        if (f.model) {                   // 移到動作結束時身體所在的位置：站起來 → 平台內 1.08；出擊、翻滾 → 剛爬到邊緣
          const k = L.getup ? 0.68 : 1.15;   // 對準動作結束時身體實際所在的位置（爬上來的動作本身會往前移）
          f.x = L.hx + (L.ix - L.hx) * k; f.z = L.hz + (L.iz - L.hz) * k;
        }
        if (L.getup === 'atk') startMove(f, 'getupAtk');                       // D：上來的同時出一擊
        else if (L.getup === 'roll') f.roll = { t: 0, dx: L.nx, dz: L.nz };    // S：翻滾到平台內側
        else f.lag = 0.14;                                                     // 一般爬上來：有短暫空檔
      }
      return;
    }
    // 抓到的瞬間平滑移到掛邊位置
    const g = Math.min(1, L.t / 0.1);
    f.x = L.sx + (L.hx - L.sx) * g; f.z = L.sz + (L.hz - L.sz) * g; f.y = L.sy + (LEDGE_Y - L.sy) * g;
    if (!active) return;
    const inward = c.mx * L.nx + c.mz * L.nz;
    // 掛住後要等 ledgeWait 秒才能上來：對手有機會把人震下去，掛著的人也有時間決定要怎麼上來
    const ready = L.t >= P.ledgeWait;
    if (ready && !L.readyFx) { L.readyFx = true; puff(L.hx, 0.15, L.hz, { size: 0.12, life: 0.3, grow: 7, opacity: 0.8 }); }
    // 等待期間按下的 W／D／S 會先記住（最後按的算數），時間一到立刻執行；按下時手邊閃一下表示有收到
    const pick = c.take('jump') ? 'jump' : c.take('atk') ? 'atk' : c.take('roll') ? 'roll' : null;
    if (pick) { L.queue = pick; if (!ready) puff(L.hx, 0.2, L.hz, { color: 0xffe9a8, size: 0.1, life: 0.22, grow: 6, opacity: 0.9 }); }
    // 攀爬時間內角色一邊往上爬（可被震下）；時間到就執行記住的按鍵，沒有按就自動站上平台
    if (ready && L.queue === 'jump') {   // W：從邊緣跳上來
      releaseLedgeVisual(f);
      f.ledge = null; f.ledgeCd = 0.5; f.y = Math.max(f.y, LEDGE_Y) + 0.01;
      f.vy = P.jumpPower * 1.1; f.vx = L.nx * 2.5; f.vz = L.nz * 2.5;
    } else if (ready) { L.climb = true; L.ct = 0; L.getup = L.queue === 'atk' ? 'atk' : L.queue === 'roll' ? 'roll' : null; }
    else if (L.t > 0.25 && inward < -0.5) { releaseLedgeVisual(f); f.ledge = null; f.ledgeCd = 0.6; f.vy = -1; }   // 往外按：放手（隨時可以）
    return;
  }

  const stunned = f.hitstun > 0 || f.dizzy > 0;
  f.hitstun = Math.max(0, f.hitstun - dt);
  f.dizzy = Math.max(0, f.dizzy - dt);
  let ix = 0, iz = 0;

  // ---- 防禦 ----
  const wasShield = f.shielding;
  f.shielding = false;
  if (f.shieldStun > 0 && wasShield) f.shielding = true;
  else if (active && !stunned && !f.move && !f.roll && f.ground && f.lag <= 0 && c.shieldHeld) f.shielding = true;
  // 防禦（按住 S）：只能在地上、不能移動；沒有耐久值（D 系列會直接打穿）；放開後有 0.1 秒空檔
  if (f.shielding) {
    if (f.shieldStun <= 0 && c.take('roll')) {   // 防禦中連按方向 = 翻滾
      let dx = c.rollDir ? c.rollDir.x : c.mx, dz = c.rollDir ? c.rollDir.z : c.mz, l = Math.hypot(dx, dz);
      if (l < 0.3) { dx = f.x - o.x; dz = f.z - o.z; l = Math.hypot(dx, dz) || 1; }
      f.roll = { t: 0, dx: dx / l, dz: dz / l }; f.shielding = false;
    }

  // ---- 彈反 ----
  f.parryOk = Math.max(0, f.parryOk - dt);
  if (stunned) c.take('parry');            // 被打中的硬直中按了不算（也不會留到硬直結束才生效）

    f.parry = { t: 0, uid: ++moveSeq }; f.parryUid = f.parry.uid;
    puff(f.x, f.y + 1.15, f.z, { color: 0xbfe3ff, size: 0.5, life: 0.2, grow: 2.2 });   // 按下的瞬間：身前一圈淡藍色的光，讓人看得出「現在在彈」
  }

  // ---- 可自由行動時：移動與出招 ----
  const free = active && !stunned && !f.move && !f.roll && !f.dodge && f.lag <= 0 && !f.shielding && !f.parry;
  if (free) {
    ix = c.mx; iz = c.mz;
    if (f.ground) {
      if (c.take('grab')) startMove(f, 'grab');
      else if (c.take('strong')) startMove(f, 'strong');
      else if (c.take('lunge')) {        // 突進：面向指定方向衝出去
        if (c.lungeDir) f.yaw = Math.atan2(c.lungeDir.x, c.lungeDir.z);
        startMove(f, 'dash');
      }
      else if (c.take('atk')) startMove(f, 'jab1');
      else if (c.take('taunt')) startMove(f, 'taunt');
      else if (c.take('jump')) { f.vy = P.jumpPower; f.ground = false; f.y = 0.001; }
      else if (c.take('roll')) {         // 翻滾閃避：往連按的方向（或正在按的方向）；都沒有就往面朝的方向
        let dx = c.rollDir ? c.rollDir.x : c.mx, dz = c.rollDir ? c.rollDir.z : c.mz, l = Math.hypot(dx, dz);
        if (l < 0.3) { dx = Math.sin(f.yaw); dz = Math.cos(f.yaw); l = 1; }
        f.roll = { t: 0, dx: dx / l, dz: dz / l };
        ix = iz = 0;
      }
    } else if (!f.helpless) {
      if (c.take('strong')) startMove(f, 'slam');
      else if (c.take('atk')) startMove(f, 'air');
      else if (c.take('jump')) {         // 空中再按一次跳躍鍵 = 上升技（落地或抓邊後才能再用）
        if (!f.specUsed) { startMove(f, 'upSpec'); puff(f.x, f.y, f.z, { size: 0.3, life: 0.25, grow: 5, opacity: 0.5 }); }
      }
    }
  } else if (active && !stunned && !f.ground && (f.helpless || (f.move && f.move.id !== 'slam') || f.dodge)) {
    ix = c.mx; iz = c.mz;                // 空中出招時仍可左右飄移
  }
  if (f.helpless) { ix *= 0.7; iz *= 0.7; }

  if (f.move) stepMove(f, c, dt);
  if (f.dodge) { f.dodge.t += dt; if (f.dodge.t >= 0.4) f.dodge = null; }

  // ---- 面向：空閒時自動面向對手 ----
  if (!f.move && !stunned && !f.roll && o.dead <= 0 && !o.out) turnTo(f, Math.atan2(o.x - f.x, o.z - f.z), 14, dt);

  // ---- 移動積分 ----
  const px = f.x, pz = f.z, py = f.y;
  if (f.roll) {                          // 翻滾：固定路徑、中段無敵
    const r = f.roll; r.t += dt;
    const s = 14 * Math.max(0, 1 - r.t / 0.38);
    f.vx = r.dx * s; f.vz = r.dz * s;
    if (r.t > ROLL_A_FROM && c.take('strong')) r.strong = true;          // 翻滾途中就按了 A：記下來，翻完馬上接
    if (r.t >= 0.38) {
      f.roll = null; f.vx = f.vz = 0;
      // 翻滾接重擊：空檔只有 ROLL_A_LAG（其他動作維持 0.14 秒）。翻滾中或翻完的瞬間按 A 都算
      if (r.strong || c.buf.strong > 0) { f.lag = ROLL_A_LAG; c.press('strong', ROLL_A_LAG + 0.12); }
      else f.lag = 0.14;
    }

    const [skx, skz] = sinkAt(f.x, f.z);  // 角落塌陷時被往那一角拉
    const ax = ix * P.accel - P.gravity * Math.sin(tilt.z) + skx * P.collapsePull;
    const az = iz * P.accel + P.gravity * Math.sin(tilt.x) + skz * P.collapsePull;

    const ac = P.accel * P.airControl * (offStage ? OFF_AIR : 1);
    f.vx += ix * ac * dt; f.vz += iz * ac * dt;
    const d = Math.exp(-(f.hitstun > 0 ? 0.55 : 2.2) * dt);
    f.vx *= d; f.vz *= d;
    f.vy -= P.airG * dt;
    const slamming = f.move && f.move.id === 'slam' && f.move.phase === 'active';
    const maxFall = offStage ? OFF_FALL : MAX_FALL;
    if (f.vy < -maxFall && !slamming) f.vy = Math.min(f.vy + 40 * dt, -maxFall);   // 超過上限時平順地減速，不會突然煞住
  }
  f.x += f.vx * dt; f.z += f.vz * dt;
  if (!f.ground) f.y += f.vy * dt;

  const k2 = rhombus(f.x, f.z);
  if (f.ground) {
    if (k2 > 1) {
      // 出招、翻滾、防禦中不會自己滑出平台；一般走動或被打退則會掉下去
      if ((f.roll || f.shielding || f.move) && f.hitstun <= 0) { f.x = px; f.z = pz; f.vx = f.vz = 0; }
      else if (f.hitstun <= 0 && f.edgeHold < EDGE_HOLD && Math.hypot(...sinkAt(f.x, f.z)) < 0.05) {
        // 邊緣保護：自己走到邊緣時先停住 0.3 秒（搖晃），繼續往外才會掉下去。被打退、角落塌陷的拉力不保護
        // 只有「按著往外」才會累積保護時間；只是被斜坡推過來、沒在操作時，就一直停在邊緣
        const ol = Math.hypot(f.x, f.z) || 1;
        if (f.edgeHold === 0 || (ix * f.x + iz * f.z) / ol > 0.3) f.edgeHold += dt;
        const sc = 0.999 / k2; f.x *= sc; f.z *= sc;
        const l = Math.hypot(f.x, f.z) || 1, nx = f.x / l, nz = f.z / l, vn = f.vx * nx + f.vz * nz;
        if (vn > 0) { f.vx -= vn * nx; f.vz -= vn * nz; }
      }
      else { f.ground = false; f.y = 0; f.vy = Math.min(f.vy, 0); f.edgeHold = 0; }
    } else if (f.edgeHold > 0 && k2 > 0.985) {
      // 還貼在邊緣並持續往外推：保護時間繼續倒數（不然每次被擋住之間的空檔會讓保護拖太久）
      const l = Math.hypot(f.x, f.z) || 1;
      if ((ix * f.x + iz * f.z) / l > 0.3) f.edgeHold += dt;
    } else if (k2 < 0.94) f.edgeHold = 0;        // 離開邊緣後重新計算
  } else {
    if (f.y <= 0 && py >= 0 && k2 <= 1 && f.vy <= 0) land(f);
    else if (f.y < 0 && k2 < 1) {        // 從側面或下方撞到平台：推回邊緣外
      const s = 1.001 / k2; f.x *= s; f.z *= s;
      const l = Math.hypot(f.x, f.z) || 1, nx = f.x / l, nz = f.z / l, vn = f.vx * nx + f.vz * nz;
      if (vn < 0) { f.vx -= vn * nx; f.vz -= vn * nz; }
    }
    if (active || game.state === 'over') tryLedge(f, dt);
  }

  // 被打飛時的殘影
  if (f.hitstun > 0 && Math.hypot(f.vx, f.vy, f.vz) > 8) {
    f.trailT -= dt;
    if (f.trailT <= 0) { f.trailT = 0.03; puff(f.x, f.y + 1, f.z, { size: 0.22, life: 0.35, grow: 2.5, opacity: 0.45 }); }
  }

  // ---- 出界 ----
  if (outOfBounds(f.x, f.y, f.z)) ko(f);
}

function pushApart(a, b) {               // 身體互相擠開（不交換速度）
  if (a.dead > 0 || b.dead > 0 || a.out || b.out || a.grabbedBy || b.grabbedBy || a.roll || b.roll || a.ledge || b.ledge) return;
  if (Math.abs(a.y - b.y) > 1.2) return;
  let dx = b.x - a.x, dz = b.z - a.z;
  const dist = Math.hypot(dx, dz);
  const R2 = BODY_R * (sz(a) + sz(b));
  if (dist >= R2 || dist < 1e-4) return;
  dx /= dist; dz /= dist;
  const o = (R2 - dist) / 2;
  a.x -= dx * o; a.z -= dz * o; b.x += dx * o; b.z += dz * o;
}

const msgEl = document.getElementById('msg');
function showMsg(t) { msgEl.textContent = t; msgEl.style.opacity = t ? 1 : 0; }
const game = { state: 'count', t: 0, round: 0, winner: null, roundWinner: null, clash: null };

function resetFighter(f, side) {
  if (f.dis) dissolveEnd(f);
  f.ghost = 0;
  Object.assign(f, {
    vx: 0, vz: 0, vy: 0, y: 0, ground: true, pct: 0, calm: 0, locked: 0, out: false, dead: 0,
    airJumps: 1, specUsed: false, dodgeUsed: false, helpless: false, move: null, hitstun: 0, dizzy: 0, lag: 0, invuln: 0,
    shield: 100, shielding: false, shieldStun: 0, parry: null, parryOk: 0, roll: null, dodge: null, ledge: null, ledgeCd: 0, grabbedBy: null,
    spin: 0, hitT: 0, landT: 0, edgeHold: 0, ledgeCount: 0, closeCall: false, launched: false,
  });
  [f.x, f.z] = fromUV(side * 3, 0);       // 每局開始：左右分開站
  f.yaw = Math.atan2(-f.x, -f.z);
}
// 每一局：雙方回到起始位置，短暫 READY 後開打
function startRound() {
  resetFighter(player, -1); resetFighter(cpu, 1);
  Object.assign(tilt, { x: 0, z: 0, vx: 0, vz: 0, y: 0, vy: 0 });
  resetBearers();
  Object.assign(ai, { think: 0.5, shieldT: 0, chargeT: 0, roll: null, jabs: 0, buf: {} });
  human.buf = {};
  game.round++;
  game.state = 'intro'; game.t = 0; game.roundWinner = null;
  for (const f of fighters) {                // 從高處落下
    f.y = INTRO.height; f.vy = 0; f.ground = false; f.introT = 0;
    f.introDelay = (f === cpu ? INTRO.cpuDelay : 0) + (P.openDark > 0.01 && !VIEW_Q ? P.openDark + 0.15 : 0);   // 燈亮之後才落下
  }
  if (P.openDark > 0.01 && !VIEW_Q) { STAGE.dark = P.openDark; STAGE.pop = 0; }   // 回合開始：全黑，燈「啪」一聲亮起
  slowT = 0; hitStop = 0;
}
function startMatch() {
  player.wins = 0; cpu.wins = 0;
  game.round = 0; game.winner = null;
  startRound();
  setPaused(false);
}
function endMatch(winner) {
  if (game.state === 'over') return;
  game.state = 'over'; game.winner = winner; game.t = 0;
}
function updateGame(dt) {
  if (game.state === 'intro') {             // 兩人都落地、站穩之後才開始
    game.t += dt; showMsg('');
    const pullLen = rigAssets.clips.pull ? rigAssets.clips.pull.duration / INTRO.pullSpeed : 0.6;
    const done = fighters.every(f => f.ground && f.introT >= INTRO.smash + pullLen + INTRO.after);
    if (done || game.t > INTRO.maxTime + P.openDark) { game.state = 'play'; game.goT = 0.5; }
  } else if (game.state === 'play' && game.goT > 0) {
    game.goT -= dt; showMsg(game.goT > 0 ? 'GO' : '');
  } else if (game.state === 'count') {
    game.t -= dt;
    showMsg(game.t > 0.45 ? 'READY' : 'GO');
    if (game.t <= 0) { game.state = 'play'; showMsg(''); }
  } else if (game.state === 'roundEnd') {
    game.t += dt;
    const w = game.roundWinner;
    showMsg(tr('roundWin')(w === player ? 'you' : 'cpu'));
    if (game.t > 2.2 + (P.koFx >= 0.5 && P.cineOn >= 0.5 ? P.koFocus : 0)) {   // 有點陣化：多留時間看完溶解再看贏家
      if (w.wins >= P.roundsToWin) endMatch(w);
      else startRound();
    }
  } else if (game.state === 'over') {
    game.t += dt;
    const w = game.winner;
    showMsg(tr('matchWin')(w === player ? 'you' : 'cpu', player.wins, cpu.wins));
  }
}

// 骨架姿勢

const clampA = (v, a) => Math.max(-a, Math.min(a, v));
function animateFighter(f, dt) {
  const rig = f.rig, t = performance.now() / 1000;
  if ((f.dead > 0 && !(f.ghost > 0)) || f.out) { f.mesh.visible = false; return; }
  f.mesh.visible = !(f.invuln > 0 && Math.floor(t * 16) % 2 === 0);   // 無敵時閃爍（點陣化中身體照樣顯示，由溶解材質從腳往上消失）
  f.mesh.position.set(f.x, f.y, f.z);
  f.mesh.rotation.y = f.yaw;
  f.mesh.rotation.order = 'YXZ'; f.mesh.rotation.x = 0;
  if (f.finHold > 0) f.finHold -= dt;
  if (f.lunge > 0) {                       // 命中瞬間貼上去：以腳為支點整個人往前傾（腳不動），之後回正
    const e = t - f.lungeAt;
    if (!f.lungeRel && hitStop <= 0 && e > 0.07) f.lungeRel = t;
    const out = f.lungeRel ? Math.min(1, (t - f.lungeRel) / 0.28) : 0;
    const k = Math.min(1, 0.75 + e / 0.03 * 0.25) * (1 - out * out * (3 - 2 * out));
    f.mesh.rotation.x = Math.asin(Math.min(0.5, (f.leanAmt || 0) * k / LEAN_H));
    f.mesh.position.x += f.lungeX * f.lunge * k; f.mesh.position.z += f.lungeZ * f.lunge * k;
    if (out >= 1) f.lunge = 0;
  }
  if (f.hitSide && f.hitT > 0) {           // 集滿演出：每一拳都把人往後、往側邊打歪一下（只是畫面，實際位置不動）
    const l = Math.hypot(f.hitX, f.hitZ) || 1, k = f.hitT * f.hitT, dx = f.hitX / l, dz = f.hitZ / l;
    f.mesh.position.x += (dx * 0.3 + dz * f.hitSide * 0.14) * k; f.mesh.position.z += (dz * 0.3 - dx * f.hitSide * 0.14) * k;   // 往拳頭揮過去的方向歪
  }
  if (hitStop > 0 && f.hitT > 0.55) {      // 停格時被打的人微微顫動
    const l = Math.hypot(f.hitX, f.hitZ) || 1, w = Math.sin(t * 110) * 0.03;
    f.mesh.position.x += f.hitX / l * w; f.mesh.position.z += f.hitZ / l * w;
  }

  const fs = Math.sin(f.yaw), fc = Math.cos(f.yaw);
  const local = (x, z) => [x * fc - z * fs, x * fs + z * fc];   // 平台座標 → [側向, 前方]
  const sp = Math.hypot(f.vx, f.vz);
  f.hitT = Math.max(0, f.hitT - dt * 2.5);
  f.landT = Math.max(0, f.landT - dt * 4);

  // 預設：格鬥架式
  let crouch = 0.2, spread = 0.08, spineX = 0.1, spineZ = 0, spineY = 0, neckX = 0, spinX = 0, spinY = 0;
  const swing = [0, 0], knee = [0, 0];
  const arm = [{ x: -0.75, z: 0.15, el: -1.6 }, { x: -0.55, z: 0.15, el: -1.4 }];
  const both = o => { Object.assign(arm[0], o); Object.assign(arm[1], o); };
  let speed = 16, opacity = 1;
  const m = f.move;

  if (f.grabbedBy) {                          // 被抓住：癱軟
    both({ x: 0.3, z: 0.3, el: -0.3 }); crouch = 0.1; spineX = -0.25; neckX = -0.3;
    swing[0] = 0.2; swing[1] = -0.1;
  } else if (f.ledge) {
    if (f.ledge.climb) { both({ x: -1.2, z: 0.2, el: -1.2 }); crouch = 0.7; spineX = 0.5; }
    else {                                           // 掛在邊緣：雙手高舉、身體懸空
      both({ x: -3.0, z: 0.1, el: -0.1 }); crouch = 0.05; spineX = 0.05;
      if (f.ledge.t < P.ledgeWait) {                 // 還不能上來：雙腳亂踢、掙扎
        swing[0] = Math.sin(t * 9) * 0.45; swing[1] = -swing[0]; knee[0] = knee[1] = 0.35;
      } else {                                       // 可以上來了：收腿準備
        swing[0] = swing[1] = -0.7; knee[0] = knee[1] = 1.2; both({ x: -2.8, z: 0.1, el: -0.6 });
      }
    }
  } else if (f.hitstun > 0) {
    if (!f.ground) {                                 // 被打飛：翻滾、手腳亂揮
      f.spin += dt * 11; spinX = -f.spin;
      for (let i = 0; i < 2; i++) { arm[i] = { x: -1.6 + Math.sin(t * 14 + i * 3) * 0.8, z: 1.0, el: -0.5 }; swing[i] = Math.sin(t * 12 + i * 3) * 0.6; knee[i] = 0.7; }
      crouch = 0.1; speed = 22;
    } else {                                         // 地面受擊：上半身往後甩
      const [hs, hw] = local(f.hitX, f.hitZ);
      spineX += clampA(-hw * 0.1, 0.7); spineZ += clampA(hs * 0.1, 0.6); neckX = clampA(hw * 0.06, 0.4);
      both({ x: -0.4, z: 0.7, el: -0.8 }); crouch = 0.3; speed = 26;
    }
  } else if (f.dizzy > 0) {                          // 破防暈眩：搖晃、雙手下垂
    both({ x: 0.1, z: 0.2, el: -0.2 }); crouch = 0.35; spineX = 0.35; neckX = 0.4;
    spineZ = Math.sin(t * 5) * 0.25; speed = 8;
  } else if (f.roll) {                               // 翻滾：縮成一團轉一圈
    spinX = (f.roll.t / 0.38) * Math.PI * 2;
    both({ x: -1.3, z: -0.3, el: -2.0 }); crouch = 1.0; spineX = 0.6; speed = 30;
  } else if (f.dodge) {                              // 空中閃避：縮身、半透明
    both({ x: -1.0, z: -0.3, el: -1.9 }); swing[0] = swing[1] = -0.8; knee[0] = knee[1] = 1.4;
    spinY = f.dodge.t / 0.4 * Math.PI * 2; opacity = 0.45; speed = 26;
  } else if (m) {
    speed = 30;
    const act = m.phase === 'active', pre = m.phase === 'startup' || m.phase === 'charge';
    if (m.id === 'jab1' || m.id === 'jab2') {        // 直拳：左右交替
      const i = m.id === 'jab1' ? 0 : 1;
      arm[i] = pre ? { x: -0.2, z: 0.2, el: -2.2 } : act ? { x: -1.55, z: -0.05, el: -0.05 } : { x: -1.2, z: 0, el: -0.7 };
      spineY = (i ? 1 : -1) * (pre ? 0.3 : -0.45); spineX = 0.2;
      swing[i] = -0.3; swing[1 - i] = 0.25;
    } else if (m.id === 'jab3') {                    // 第三段：前踢
      swing[0] = pre ? 0.3 : act ? -1.5 : -0.7; knee[0] = pre ? 1.2 : 0.1;
      spineX = act ? -0.25 : 0.1; both({ x: -0.5, z: 0.5, el: -1.4 });
    } else if (m.id === 'getupAtk') {                // 爬上來的掃擊
      spineX = 0.5; spineY = act ? -0.6 : 0.4; crouch = 0.45;
      arm[0] = { x: -1.4, z: act ? -0.5 : 0.9, el: -0.2 }; arm[1] = { x: -0.4, z: 0.4, el: -1.2 };
    } else if (m.id === 'dash') {                    // 衝刺攻擊：肩撞
      spineX = 0.75; spineY = 0.5; crouch = 0.35;
      arm[0] = { x: -1.2, z: -0.5, el: -1.9 }; arm[1] = { x: 0.6, z: 0.3, el: -0.6 };
      swing[0] = -0.8; knee[0] = 0.3; swing[1] = 0.6;
    } else if (m.id === 'strong') {
      if (pre) {                                     // 蓄力：雙手後拉、身體下沉並顫抖
        const j = m.phase === 'charge' ? Math.sin(t * 60) * 0.04 * (1 + m.charge) : 0;
        both({ x: 0.5 + j, z: 0.25, el: -2.0 }); crouch = 0.5 + m.charge * 0.15; spineX = -0.2 + j; spread = 0.2;
      } else {                                       // 出手：雙掌前推
        both({ x: -1.55, z: -0.1, el: -0.05 }); spineX = act ? 0.65 : 0.4; crouch = 0.3;
        swing[0] = -0.8; knee[0] = 0.3; swing[1] = 0.6;
      }
    } else if (m.id === 'air') {                     // 空中迴旋踢
      spinY = act ? m.pt / m.def.active * Math.PI * 2 : 0;
      swing[0] = -1.3; knee[0] = 0.1; swing[1] = 0.7; knee[1] = 0.9;
      both({ x: -0.3, z: 1.3, el: -0.3 });
    } else if (m.id === 'slam') {
      if (pre) { both({ x: -2.6, z: 0.3, el: -0.6 }); swing[0] = swing[1] = -1.0; knee[0] = knee[1] = 1.6; }
      else if (act) { both({ x: -2.9, z: 0.25, el: -0.1 }); crouch = 0; spineX = -0.05; }        // 雙腳併攏下墜
      else { both({ x: -0.9, z: 0.4, el: -0.3 }); crouch = 0.85; spineX = 0.5; spread = 0.25; }   // 落地重蹲
    } else if (m.id === 'upSpec') {                  // 上升技：單手上勾、旋轉上升
      arm[0] = { x: -3.0, z: 0.05, el: -0.05 }; arm[1] = { x: 0.3, z: 0.3, el: -0.8 };
      swing[0] = 0.2; swing[1] = -0.5; knee[1] = 0.9; crouch = 0;
      spinY = act ? m.pt / m.def.active * Math.PI * 4 : 0;
    } else if (m.id === 'grab') {                    // 抓取：雙手往前撲
      both(pre ? { x: -1.0, z: 0.7, el: -0.6 } : { x: -1.45, z: act ? 0.1 : 0.4, el: -0.3 });
      spineX = 0.45; swing[0] = -0.5; swing[1] = 0.3;
    } else if (m.id === 'hold') {
      both({ x: -1.35, z: 0.05, el: -0.5 }); spineX = 0.2; crouch = 0.3; spread = 0.18;
    } else if (m.id === 'throwRec') {
      both({ x: -1.7, z: 0.2, el: -0.1 }); spineX = 0.55; swing[0] = -0.7; swing[1] = 0.5;
    }
  } else if (f.shielding || f.parry) {               // 防禦／彈反：蹲低、雙臂交叉
    both({ x: -1.2, z: -0.4, el: -1.6 }); crouch = 0.55; spread = 0.26; spineX = 0.25; neckX = 0.15; speed = 24;
  } else if (!f.ground) {
    if (f.helpless) { both({ x: -0.3, z: 0.6, el: -0.4 }); swing[0] = -0.2; swing[1] = 0.2; knee[0] = knee[1] = 0.5; spineX = -0.1; }
    else {
      const rising = f.vy > 0;                       // 上升收腿、下降伸腳
      swing[0] = rising ? -1.0 : -0.3; swing[1] = rising ? -0.5 : 0.1;
      knee[0] = rising ? 1.5 : 0.5; knee[1] = rising ? 1.1 : 0.4;
      both({ x: rising ? -1.9 : -1.1, z: 0.5, el: -0.6 }); crouch = 0; spineX = 0.12;
    }
  } else {
    // 走動：依實際移動方向擺腿（面向對手時可能是後退或橫移）
    const [vs, vw] = local(f.vx, f.vz);
    const amp = Math.min(1, sp / 6);
    f.walk += sp * dt * 2.2 * (vw < -0.5 ? -1 : 1);
    swing[0] = Math.sin(f.walk) * 0.65 * amp; swing[1] = -swing[0];
    knee[0] = Math.max(0, -Math.cos(f.walk)) * 0.9 * amp;
    knee[1] = Math.max(0, Math.cos(f.walk)) * 0.9 * amp;
    arm[0].x += swing[1] * 0.4; arm[1].x += swing[0] * 0.4;
    spineX += clampA(vw * 0.03, 0.3); spineZ -= clampA(vs * 0.04, 0.3);
    spineX += Math.sin(t * 2.2 + f.x) * 0.02;
    if (f.lag > 0) crouch += 0.2;
    // 靠近邊緣且沒在移動：揮手平衡
    const ed = edgeDist(f.x, f.z);
    if (f.edgeHold > 0 || (ed < 0.6 && sp < 2)) {
      const w = f.edgeHold > 0 ? 1 : (0.6 - ed) / 0.6;
      if (f.edgeHold > 0) { spineX -= 0.35; crouch += 0.15; }      // 邊緣保護中：身體後仰、搖晃
      for (let i = 0; i < 2; i++) { arm[i].x = -1.3 + Math.sin(t * 16 + i * Math.PI) * 1.3 * w; arm[i].z = 0.4 + 0.8 * w; arm[i].el = -0.4; }
    }
  }

  if (f.ground && !f.roll) {
    // 平台傾斜時往高處傾；落地時屈膝緩衝
    const [us, uw] = local(Math.sin(tilt.z), -Math.sin(tilt.x));
    spineX += uw * 1.2; spineZ -= us * 1.2;
    crouch += f.landT * 0.45;
  }
  if (!(f.hitstun > 0 && !f.ground)) f.spin = 0;

  // ---- 套用 ----
  const k = 1 - Math.exp(-dt * speed);
  const to = (obj, prop, v) => { obj[prop] += (v - obj[prop]) * k; };
  let hipY = 0;
  rig.legs.forEach((l, i) => {
    to(l.thigh.rotation, 'x', -crouch + swing[i]);
    to(l.thigh.rotation, 'z', l.s * spread);
    to(l.shin.rotation, 'x', 2 * crouch + knee[i]);
    l.foot.rotation.x = -(l.thigh.rotation.x + l.shin.rotation.x);
    const a1 = l.thigh.rotation.x, a2 = a1 + l.shin.rotation.x;
    hipY = Math.max(hipY, LEG * Math.cos(a1) * Math.cos(l.thigh.rotation.z) + LEG * Math.cos(a2));
  });
  rig.hips.position.y = FOOT_H + hipY - BODY_Y;
  rig.body.rotation.x = spinX; rig.body.rotation.y = spinY;
  to(rig.spine.rotation, 'x', clampA(spineX, 1.1));
  to(rig.spine.rotation, 'z', clampA(spineZ, 0.8));
  to(rig.spine.rotation, 'y', spineY);
  to(rig.neck.rotation, 'x', clampA(neckX - spineX * 0.4, 0.8));
  rig.arms.forEach((a, i) => {
    to(a.shoulder.rotation, 'x', arm[i].x);
    to(a.shoulder.rotation, 'z', a.s * arm[i].z);
    to(a.elbow.rotation, 'x', arm[i].el);
  });
  // 蓄力過半（可以硬吃 D）時身體發出金光
  const flash = f.flashAt ? Math.max(0, 1 - (t - f.flashAt) / 0.13) : 0;          // 被打中的瞬間全身閃白
  const glow = flash > 0 ? flash * 0.3 : isArmored(f) ? 0.35 + 0.15 * Math.sin(t * 30) : 0;
  if (glow !== f.glow) { f.glow = glow; for (const mt of f.mats) { mt.emissive.setHex(flash > 0 ? 0xffffff : 0xffb040); mt.emissiveIntensity = glow; } }
  rig.bubble.visible = f.shielding;
  if (f.shielding) rig.bubble.material.opacity = f.shieldStun > 0 ? 0.35 : 0.16;
  if (f.shielding) rig.bubble.scale.setScalar(0.6 + 0.5 * Math.max(0, f.shield) / 100);
  if (f.model) updateModel(f, dt, spinX, spinY);
  if (f.bib) stepBib(f, hitStop > 0 ? dt * 0.05 : dt);
  if (f.skirt) stepSkirt(f, hitStop > 0 ? dt * 0.05 : dt);
  if (f.f1sh) syncF1(f);   // 圍兜下襬晃動（停格時一起停）
  if (f.opacity !== opacity) {           // 空中閃避時半透明
    f.opacity = opacity;
    rig.body.traverse(o => { if (o.isMesh) { o.material.transparent = opacity < 1; o.material.opacity = opacity; } });
  }
}

// =====================================================================
// 骨架人物（Mixamo）
//   character.fbx：人物本體（附帶 Body Block 動作）；idle / punch / hit：只有動作。
//   載入完成前（或載入失敗時）沿用程式組成的方塊人。位移由遊戲物理控制，所以把動作的水平位移鎖住。
// =====================================================================
// 網址加 ?char=xbot：改用早期版本的 Mixamo 預設人偶（X Bot）；?char=box：最早期的方塊人。拍迭代對比用
const CHAR_MODE = new URLSearchParams(location.search).get('char');
const CHAR_FILES = CHAR_MODE === 'xbot' ? ['character'] : ['gi', 'character'];   // 角色模型檔（ 裡），依序嘗試
// ?char=fighter1：玩家用第一個鬥士（牛角飛行帽＋圍兜），對手照舊用道服角色。鬥士的體型放大 F1_SIZE 倍（只是外觀，碰撞範圍不變）
// 選角：?char= 是玩家的角色、?foe= 是對手的角色（沒寫 = 道服角色）。fighter1：第一個鬥士（第二版身體），fighter1old：舊版
const CHAR_SPEC = { fighter1: { file: 'fighter1v2', size: 1.25 }, fighter1old: { file: 'fighter1', size: 1.25 },
  // 第二個鬥士＝前衛老人（模型檔 fighter3）：總高 180 公分（含頭頂髮髻）。道服角色是 185 公分，所以倍率 = 1.80 / 1.85
  // 原本的第二個鬥士（銀髮老武士、紫色盔甲，模型檔 fighter2）2026-11-21 使用者決定刪掉，不再出現在選角裡
  fighter2: { file: 'fighter3', size: 1.80 / 1.85 } };
const FOE_MODE = new URLSearchParams(location.search).get('foe');
const P_SPEC = CHAR_SPEC[CHAR_MODE] || null, C_SPEC = new URLSearchParams(location.search).get('view') === 'character' ? null : CHAR_SPEC[FOE_MODE] || null;   // 角色預覽沒有對手，不用讀
const rigAssets = { ready: false, base: null, clips: {}, impact: {}, scale: 1, missing: [] };
// 動作檔對照表。lockY：連上下位移也鎖住（跳躍、下墜、爬上來的高度由遊戲物理控制）
const RIG_CLIPS = {

    scene.fog.near = 300; scene.fog.far = 600;               // 預覽時不要霧，拉遠也看得清楚
  }
  for (const o of scene.children) if (!o.isLight && o !== platform && o !== spot.target) o.visible = false;   // 抬轎的人、特效都不顯示
  for (const f of fighters) f.mesh.visible = false;
  platform.rotation.set(0, 0, 0); platform.position.y = 0;
  orbit.update();
}
{ const self = location.pathname.split('/').pop() || 'index.html';
  document.getElementById('viewBack').href = self;

// ---- 選角 ----
// 選好之後換網址重新載入：?char= 玩家、?foe= 對手（每隻角色的模型、貼圖、動作換算都要重新讀）
const PICK_KEYS = ['', 'fighter1', 'fighter2'];
const pickSel = { char: CHAR_SPEC[CHAR_MODE] ? CHAR_MODE : '', foe: CHAR_SPEC[FOE_MODE] ? FOE_MODE : '' };
function gameUrl(extra) {
  const q = new URLSearchParams(location.search);
  for (const k of ['char', 'foe']) { if (pickSel[k]) q.set(k, pickSel[k]); else q.delete(k); }
  q.delete('view'); if (extra) for (const k in extra) q.set(k, extra[k]);
  const qs = q.toString();
  return (location.pathname.split('/').pop() || 'index.html') + (qs ? '?' + qs : '');
}
function charViewUrl() { return gameUrl({ view: 'character' }); }
const pickEl = document.getElementById('pick');
function renderPick() {
  for (const box of pickEl.querySelectorAll('.opts')) {
    const side = box.dataset.side; box.innerHTML = '';
    PICK_KEYS.forEach((k, i) => {
      const b = document.createElement('button'); b.textContent = tr('charNames')[i];
      if (pickSel[side] === k) b.classList.add('sel');
      b.addEventListener('click', () => { pickSel[side] = k; renderPick(); });
      box.appendChild(b);
    });
  }
}
let pickWasPaused = false;
function openPick(v) {
  if (v) { pickWasPaused = paused; setPaused(true); renderPick(); }
  else if (!pickWasPaused) setPaused(false);
  pickEl.classList.toggle('on', v);
}
document.getElementById('pickBtn').addEventListener('click', e => { e.currentTarget.blur(); openPick(true); });
document.getElementById('pickCancel').addEventListener('click', () => {
  pickSel.char = CHAR_SPEC[CHAR_MODE] ? CHAR_MODE : ''; pickSel.foe = CHAR_SPEC[FOE_MODE] ? FOE_MODE : ''; openPick(false); });
document.getElementById('pickGo').addEventListener('click', () => { location.href = gameUrl(); });
document.getElementById('pickView').addEventListener('click', () => { location.href = charViewUrl(); });
pickEl.addEventListener('click', e => { if (e.target === pickEl) document.getElementById('pickCancel').click(); });
addEventListener('keydown', e => {                 // 選角畫面開著時，按鍵不傳給遊戲；Esc 關閉、Enter 開始
  if (!pickEl.classList.contains('on')) return;
  e.stopImmediatePropagation(); e.preventDefault();
  if (e.code === 'Escape') document.getElementById('pickCancel').click();
  else if (e.code === 'Enter') document.getElementById('pickGo').click();
}, true);
function frame(now) {
  stepAutoRes(now - fpsStat.last, now);
  updateFps(now);
  const realDt = Math.min(0.1, (now - last) / 1000);
  last = now;
  cameraKeys(realDt);
  if (!loadDone.shown) {                    // 載入中：先不開始比賽
    const n = (loadDone.rig ? 1 : 0) + (loadDone.bear ? 1 : 0) + (loadDone.mat ? 1 : 0);
    document.querySelector('#loading .bar i').style.width = `${15 + n * 28}%`;
    if (n === 3 || performance.now() - loadDone.t0 > 40000) {
      loadDone.shown = true;
      const el = document.getElementById('loading'); el.style.opacity = 0; setTimeout(() => el.remove(), 600);
      startMatch();
      if (CHAR_VIEW) initCharView();
      if (tutWanted() && !VIEW_ONLY && !CHAR_VIEW) beginTutorial();      // 第一次打開：先玩教程
    } else { draw(); requestAnimationFrame(frame); return; }
  }
  if (VIEW_ONLY) { stepPlatformView(); draw(); requestAnimationFrame(frame); return; }
  if (CHAR_VIEW && paused) setPaused(false);
  if (paused) { draw(); requestAnimationFrame(frame); return; }

  if (!Number.isFinite(hitStop)) hitStop = 0;
  if (!Number.isFinite(slowT)) slowT = 0;
  let dt = realDt;
  if (slowT > 0) { slowT -= realDt; dt *= 0.3; }       // 決勝瞬間慢動作
  else if (game.state === 'play' && someoneHanging()) { dt *= P.ledgeSlow; ledgeClock = 1 / P.ledgeSlow; }   // 有人掛在邊緣：整個遊戲放慢，拉高張力
  else ledgeClock = 1;
  if (hitStop > 0) hitStop -= realDt; else acc += dt;  // 打擊停格
  while (acc >= STEP) {
    const active = game.state === 'play';
    updateHuman(STEP);
    if (CHAR_VIEW) { charViewSim(); stepFighter(player, human, STEP, true); charViewSim(); stepFx(STEP); acc -= STEP; continue; }
    stepBearers(STEP);
    stepTilt(STEP);
    if (game.clash && active) stepClash(STEP);               // 連打對決：只有攻擊方能動
    else {
      game.clash = null;
      updateAI(STEP);
      stepFighter(player, human, STEP, active);
      stepFighter(cpu, ai, STEP, active);
      pushApart(player, cpu);
      processHits(player, cpu);
      processHits(cpu, player);
    }
    stepFx(STEP);
    acc -= STEP;
  }
  for (const f of fighters) {              // 防護：角色的位置或速度壞掉 → 放回平台中央
    if (![f.x, f.y, f.z, f.vx, f.vy, f.vz, f.yaw].every(Number.isFinite)) { f.x = f.z = f.y = f.vx = f.vz = f.vy = 0; f.yaw = 0; f.ground = true; f.move = null; diag.pos++; }
  }
  if (![tilt.x, tilt.z, tilt.y].every(Number.isFinite)) { Object.assign(tilt, { x: 0, z: 0, y: 0, vx: 0, vz: 0, vy: 0 }); diag.pos++; }
  if (CHAR_VIEW) { platform.rotation.set(0, 0, 0); platform.position.y = 0; animateFighter(player, dt); stepCharCam(); draw(); requestAnimationFrame(frame); return; }
  updateGame(dt);
  if (tut.active) stepTutorial(realDt);
  floorFit();
  platformVisual(dt);
  animateBearers(dt);
  for (const f of fighters) { animateFighter(f, dt); updateGrip(f); }   // 對決中被打的人：動作放慢
  updateCamera(realDt);
  updateHud();
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
