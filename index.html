function renderTut() {
  if (!tut.active) return;
  const end = tut.step >= TUT_STEPS.length, st = TUT_STEPS[Math.min(tut.step, TUT_STEPS.length - 1)];
  const need = end ? 1 : st.need || TUT_NEED;
  tutEl.querySelector('.tstep').textContent = tr('tutStep')(Math.min(tut.step + 1, TUT_STEPS.length), TUT_STEPS.length) + (need > 1 ? `　·　${Math.min(tut.count, need)} / ${need}` : '');
  tutEl.querySelector('.ttitle').textContent = end ? tr('tutEnd') : tr('tut')[st.id][0];
  tutEl.querySelector('.tdesc').textContent = end ? tr('tutEndD') : tr('tut')[st.id][1];
  const kb = tutEl.querySelector('.tkeys'); kb.textContent = '';
  if (!end) {
    st.keys.forEach(k => { const e = document.createElement(k === '+' || k === '/' ? 'span' : 'kbd'); e.textContent = k; kb.appendChild(e); });
    if (st.hold) { const e = document.createElement('span'); e.textContent = LANG === 'zh' ? '按住' : 'hold'; kb.insertBefore(e, kb.firstChild); }
    if (st.times) { const e = document.createElement('span'); e.textContent = '× ' + st.times; kb.appendChild(e); }
  }
  tutEl.classList.toggle('done', tut.phase === 'done' || tut.phase === 'again' || end);
}
function tutPlaceCpu() {                   // 把沙包放回玩家面前（平台中央附近）
  const [x, z] = fromUV(toU(player.x, player.z) > 0.3 ? -1.3 : 1.3, 0);
  Object.assign(cpu, { x, z, y: 0, vx: 0, vz: 0, vy: 0, ground: true, move: null, hitstun: 0, lag: 0, roll: null, ledge: null, helpless: false, launched: false, out: false, dead: 0, invuln: 0 });
  cpu.yaw = Math.atan2(player.x - cpu.x, player.z - cpu.z);
  spark(cpu.x, 1.0, cpu.z, 6, 0xbfe3ff);
}
function tutSetStep(i) {
  tut.step = i; tut.phase = i >= TUT_STEPS.length ? 'end' : 'run'; tut.t = 0; tut.prog = 0; tut.lit = 0; tut.idleT = 0; tut.count = 0;
  if (i < TUT_STEPS.length && !game.clash) {
    cpu.pct = TUT_STEPS[i].id === 'clash' ? ROW_PTS - 4 : 0; cpu.locked = 0;
    if (!cpu.ground || cpu.hitstun > 0 || Math.hypot(cpu.x - player.x, cpu.z - player.z) > 3.2 || edgeDist(cpu.x, cpu.z) < 1.4) tutPlaceCpu();
  }
  renderTut();
}
function beginTutorial() { tut.active = true; tutEl.classList.add('on'); tutSetStep(0); }
function endTutorial() {
  tut.active = false; tutEl.classList.remove('on', 'done');
  try { localStorage.setItem('sumo-tut-done', '1'); } catch (e) {}
  startMatch();
}
function stepTutorial(dt) {
  const p = player, st = TUT_STEPS[tut.step], bar = tutEl.querySelector('.tbar i');
  if (game.state !== 'play') { tut.wasGround = p.ground; tut.px = p.x; tut.pz = p.z; return; }
  // 教程中不分勝負：玩家的量表不累積；掉出去就放回平台
  p.pct = 0; p.locked = 0;
  if (edgeDist(p.x, p.z) < -3 || p.y < -4) { resetFighter(p, -1); p.pct = 0; }
  if (!game.clash && (edgeDist(cpu.x, cpu.z) < -0.6 || cpu.y < -2 || cpu.ledge)) tutPlaceCpu();
  if (tut.phase === 'end') { tut.t += dt; if (tut.t > 2.2) endTutorial(); return; }
  if (tut.phase === 'done') { tut.t += dt; if (tut.t > 0.9) tutSetStep(tut.step + 1); return; }
  if (tut.phase === 'again') {             // 做完一次：等這個動作結束、人回到地面，再做下一次
    tut.t += dt;
    if (!game.clash) { if (st.id === 'clash') { cpu.locked = 0; cpu.pct = ROW_PTS - 4; } else { cpu.pct = 0; cpu.locked = 0; } }
    if (tut.t > 0.7 && !p.move && !p.roll && p.ground && !(p.hitstun > 0) && !game.clash && !(p.finHold > 0)) {
      if (!cpu.ground || cpu.hitstun > 0 || Math.hypot(cpu.x - p.x, cpu.z - p.z) > 3.2 || edgeDist(cpu.x, cpu.z) < 1.4) tutPlaceCpu();
      tut.phase = 'run'; tut.prog = 0; tut.lit = 0; tut.idleT = 0; tut.wasGround = true; tut.px = p.x; tut.pz = p.z;
      tutEl.querySelector('.tbar i').style.width = '0%';
      tutEl.querySelectorAll('.tkeys kbd').forEach(e => e.classList.remove('lit'));
      renderTut();
    }
    return;
  }
  const m = p.move, id = st.id;
  let done = false, prog = 0;
  if (!game.clash && id !== 'clash') { cpu.pct = 0; cpu.locked = 0; }      // 練習時對手的量表不累積（不會意外觸發 12 連擊）
  if (id === 'move') {
    if (p.ground && (human.mx || human.mz)) tut.prog += Math.hypot(p.x - tut.px, p.z - tut.pz);
    prog = tut.prog / 5; done = prog >= 1;
  } else if (id === 'jump') done = tut.wasGround && !p.ground && p.vy > 2 && !(p.hitstun > 0);
  else if (id === 'up') done = !!m && m.id === 'upSpec';
  else if (id === 'roll') done = !!p.roll;
  else if (id === 'jab') {
    const n = m && m.hit ? (m.id === 'jab1' ? 1 : m.id === 'jab2' ? 2 : m.id === 'jab3' ? 3 : 0) : 0;
    if (n) { tut.lit = Math.max(tut.lit, n); tut.idleT = 0; } else if (!m) { tut.idleT += dt; if (tut.idleT > 0.7) tut.lit = 0; }
    prog = tut.lit / 3; done = tut.lit >= 3;
  } else if (id === 'strong') done = !!m && m.id === 'strong' && m.hit;
  else if (id === 'charge') {
    if (m && m.id === 'strong') { tut.prog = Math.max(m.phase === 'charge' ? 0 : tut.prog, m.charge || 0); prog = Math.min(1, (m.charge || 0) / TUT_CHARGE); done = m.phase !== 'startup' && m.phase !== 'charge' && (m.charge || 0) >= TUT_CHARGE; }
  } else if (id === 'dash') done = !!m && m.id === 'dash';
  else if (id === 'air') done = !!m && m.id === 'air';
  else if (id === 'slam') done = !!m && m.id === 'slam';
  else if (id === 'clash') {
    if (!game.clash && cpu.locked === 0 && cpu.pct < ROW_PTS - 4) cpu.pct = ROW_PTS - 4;     // 量表固定在「差一格就滿」：不會隨時間減少，沒按滿 12 下也會補回來再試一次
    prog = game.clash ? Math.min(1, (game.clash.presses || 0) / CLASH_NEED) : 0; done = cpu.locked >= 1 && !game.clash;
  }
  tut.wasGround = p.ground; tut.px = p.x; tut.pz = p.z;
  bar.style.width = Math.round(Math.max(0, Math.min(1, prog)) * 100) + '%';
  if (id === 'jab') tutEl.querySelectorAll('.tkeys kbd').forEach((e, i) => e.classList.toggle('lit', i < tut.lit));
  if (done) { tut.count++; tut.phase = tut.count >= (st.need || TUT_NEED) ? 'done' : 'again'; tut.t = 0; renderTut(); }
}
document.getElementById('tutSkip').addEventListener('click', e => { endTutorial(); e.currentTarget.blur(); });
document.getElementById('tutBtn').addEventListener('click', e => { e.currentTarget.blur(); startMatch(); beginTutorial(); });

// =====================================================================
// 主迴圈（固定 120Hz 物理步長）
// =====================================================================
window.__sumo = { makeAnimPack, tut, beginTutorial, endTutorial, get bloomPass() { return bloomPass; }, retargetCC, rigAssets, HITANIM, applyHit, startClash, player, cpu, P, game, human, ai, tilt, bearers, corners, camera, platform, MOVES, isPaused: () => paused };   // 除錯用
const STEP = 1 / 120;
let acc = 0, last = performance.now();
startMatch();

// 幀數顯示（F 鍵開關）：每 0.5 秒更新一次平均 FPS 與最慢的一格
const fpsEl = document.getElementById('fps');
if (document.body.dataset.build === 'public') fpsEl.style.display = 'none';   // 朋友版預設不顯示 FPS（按 F 打開）
const fpsStat = { n: 0, t: 0, worst: 0, last: performance.now() };
function updateFps(now) {
  const ms = now - fpsStat.last; fpsStat.last = now;
  fpsStat.n++; fpsStat.t += ms; fpsStat.worst = Math.max(fpsStat.worst, ms);
  if (fpsStat.t >= 500) {
    fpsEl.textContent = `${Math.round(fpsStat.n * 1000 / fpsStat.t)} FPS　${tr('worst')} ${fpsStat.worst.toFixed(0)} ms` + `　×${renderer.getPixelRatio().toFixed(2)}` + (diag.gl || diag.cam || diag.pos ? `　⚠ GL${diag.gl} cam${diag.cam} pos${diag.pos}` : '');
    fpsStat.n = 0; fpsStat.t = 0; fpsStat.worst = 0;
  }
}
// 自動解析度：連續卡頓（平均低於約 51 FPS）就把解析度降一階，順了一陣子再慢慢調回設定值；不會超過面板設定的解析度
const autoRes = { cur: null, t: 0, n: 0, good: 0, lock: 0 };
function stepAutoRes(ms, now) {
  const target = Math.min(devicePixelRatio, P.resScale);
  if (!(P.autoRes > 0.5)) { if (autoRes.cur !== null) { autoRes.cur = null; renderer.setPixelRatio(target); resize(); } return; }
  if (autoRes.cur === null || autoRes.cur > target) autoRes.cur = target;
  if (ms > 120 || paused || document.hidden || !loadDone.shown) { autoRes.t = 0; autoRes.n = 0; return; }   // 切換分頁、暫停、載入中：不算
  autoRes.t += ms; autoRes.n++;
  if (autoRes.t < 1000) return;
  const avg = autoRes.t / autoRes.n; autoRes.t = 0; autoRes.n = 0;
  let next = autoRes.cur;
  if (avg > 19.5 && autoRes.cur > 1) { next = Math.max(1, autoRes.cur - (avg > 26 ? 0.2 : 0.1)); autoRes.lock = now + 20000; autoRes.good = 0; }
  else if (avg < 17.3 && autoRes.cur < target) { if (++autoRes.good >= 5 && now > autoRes.lock) { next = Math.min(target, autoRes.cur + 0.1); autoRes.good = 0; } }
  else autoRes.good = 0;
  if (Math.abs(next - autoRes.cur) > 1e-3) { autoRes.cur = next; renderer.setPixelRatio(next); resize(); }
}
function frame(now) {
  stepAutoRes(now - fpsStat.last, now);
  updateFps(now);
  const realDt = Math.min(0.1, (now - last) / 1000);
  last = now;
  cameraKeys(realDt);
  if (!loadDone.shown) {                    // 載入中：先不開始比賽
    const n = (loadDone.rig ? 1 : 0) + (loadDone.bear ? 1 : 0) + (loadDone.mat ? 1 : 0);
    document.querySelector('#loading .bar i').style.width = `${15 + n * 28}%`;
    if (n === 3 || performance.now() - loadDone.t0 > 40000) {
      loadDone.shown = true;
      const el = document.getElementById('loading'); el.style.opacity = 0; setTimeout(() => el.remove(), 600);
      startMatch();
      if (tutWanted()) beginTutorial();      // 第一次打開：先玩教程
    } else { draw(); requestAnimationFrame(frame); return; }
  }
  if (paused) { draw(); requestAnimationFrame(frame); return; }

  if (!Number.isFinite(hitStop)) hitStop = 0;
  if (!Number.isFinite(slowT)) slowT = 0;
  let dt = realDt;
  if (slowT > 0) { slowT -= realDt; dt *= 0.3; }       // 決勝瞬間慢動作
  else if (game.state === 'play' && someoneHanging()) { dt *= P.ledgeSlow; ledgeClock = 1 / P.ledgeSlow; }   // 有人掛在邊緣：整個遊戲放慢，拉高張力
  else ledgeClock = 1;
  if (hitStop > 0) hitStop -= realDt; else acc += dt;  // 打擊停格
  while (acc >= STEP) {
    const active = game.state === 'play';
    updateHuman(STEP);
    stepBearers(STEP);
    stepTilt(STEP);
    if (game.clash && active) stepClash(STEP);               // 連打對決：只有攻擊方能動
    else {
      game.clash = null;
      updateAI(STEP);
      stepFighter(player, human, STEP, active);
      stepFighter(cpu, ai, STEP, active);
      pushApart(player, cpu);
      processHits(player, cpu);
      processHits(cpu, player);
    }
    stepFx(STEP);
    acc -= STEP;
  }
  for (const f of fighters) {              // 防護：角色的位置或速度壞掉 → 放回平台中央
    if (![f.x, f.y, f.z, f.vx, f.vy, f.vz, f.yaw].every(Number.isFinite)) { f.x = f.z = f.y = f.vx = f.vz = f.vy = 0; f.yaw = 0; f.ground = true; f.move = null; diag.pos++; }
  }
  if (![tilt.x, tilt.z, tilt.y].every(Number.isFinite)) { Object.assign(tilt, { x: 0, z: 0, y: 0, vx: 0, vz: 0, vy: 0 }); diag.pos++; }
  updateGame(dt);
  if (tut.active) stepTutorial(realDt);
  platform.rotation.set(tilt.x, 0, tilt.z);
  platform.position.y = tilt.y;
  animateBearers(dt);
  for (const f of fighters) { animateFighter(f, dt); updateGrip(f); }   // 對決中被打的人：動作放慢
  updateCamera(realDt);
  updateHud();
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
