<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUMO</title>
<style>
  html, body { margin: 0; height: 100%; background: #070b14; overflow: hidden;
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; color: #eee; }
  canvas { display: block; }
  #hint { position: fixed; left: 16px; top: 12px; font-size: 12px; opacity: .65; line-height: 1.7; max-width: 38vw; }
  #timer { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); font-size: 26px; font-weight: 700;
    font-variant-numeric: tabular-nums; letter-spacing: .05em; text-shadow: 0 0 8px #000; }
  #hud { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 70px; pointer-events: none; }
  .card { min-width: 170px; text-align: center; text-shadow: 0 0 10px #000, 0 0 3px #000;
    background: rgba(0,0,0,.62); border-radius: 6px; padding: 8px 14px 10px; }
  .card .name { font-size: 13px; letter-spacing: .2em; opacity: .85; }
  .card .name i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  /* 10 格量表：格數越多越容易被打飛 */
  .card .gauge { display: flex; gap: 3px; justify-content: center; margin: 8px 0 6px; }
  .card .gauge span { width: 14px; height: 22px; background: rgba(255,255,255,.12); border-radius: 2px; transform: skewX(-12deg); }
  .card .gauge span.on { background: #f2efe8; }
  .card .gauge span.on.mid { background: #ffb347; }
  .card .gauge span.on.hi { background: #ff4a3a; }
  .card .gauge.danger span.on { animation: pulse .5s infinite alternate; }
  @keyframes pulse { to { opacity: .45; } }
  .card .wins span { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin: 0 4px; border: 2px solid #eee; box-sizing: border-box; }
  .card .wins span.won { background: #eee; }
  /* 道場的電影感：四周壓暗、偏冷 */
  #grade { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 75% 70% at 50% 52%, rgba(4,8,18,0) 55%, rgba(4,8,18,.55) 100%); }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .45s ease-out; }
  #vig { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .12s;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,.75) 100%); }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: #070b14; z-index: 50; transition: opacity .5s; letter-spacing: .3em; }
  #loading .t { font-size: 44px; font-weight: 800; }
  #loading .s { font-size: 13px; opacity: .7; }
  #loading .bar { width: 220px; height: 4px; background: rgba(255,255,255,.15); border-radius: 2px; overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 0; background: #d8261b; transition: width .3s; }
  #langBtn { position: fixed; left: 16px; bottom: 14px; z-index: 40; background: rgba(0,0,0,.55); color: #eee; border: 1px solid #444;
    border-radius: 6px; padding: 6px 12px; font-size: 12px; letter-spacing: .1em; cursor: pointer; }
  #langBtn:hover { border-color: #d8261b; }
  #fps { position: fixed; right: 16px; bottom: 12px; font: 12px/1.4 ui-monospace, monospace; opacity: .7; text-align: right; pointer-events: none; }
  #msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 64px; font-weight: 800; letter-spacing: .1em; pointer-events: none; opacity: 0;
    transition: opacity .15s; text-shadow: 0 0 20px #000; text-align: center; white-space: pre-line; }
  #pause { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; pointer-events: none; text-shadow: 0 0 12px #000, 0 0 4px #000; }
  #pause.on { display: flex; }
  #pause .title { font-size: 56px; font-weight: 800; letter-spacing: .3em; }
  #pause .sub { font-size: 14px; opacity: .85; }
  #camRail { position: fixed; left: 16px; top: 50%; transform: translateY(-50%); width: 56px;
    display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 0;
    background: rgba(20,20,20,.85); border: 1px solid #333; border-radius: 8px; font-size: 11px; user-select: none; }
  #camRail .cap { opacity: .7; }
  #camRail button { width: 32px; height: 26px; background: #333; color: #eee; border: 0; border-radius: 4px;
    cursor: pointer; font-size: 11px; touch-action: none; }
  #camRail button:active { background: #d8261b; }
  #camRail .track { position: relative; width: 8px; height: min(260px, 40vh); background: #333; border-radius: 4px;
    cursor: ns-resize; touch-action: none; }
  #camRail .track::before { content: ''; position: absolute; inset: 0 -14px; }
  #camRail .fill { position: absolute; left: 0; right: 0; bottom: 0; background: #d8261b; border-radius: 4px; }
  #camRail .thumb { position: absolute; left: 50%; width: 22px; height: 18px; margin-left: -11px; background: #eee;
    border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.6); }
  #camRail .val { font-variant-numeric: tabular-nums; opacity: .85; }
  #panel { position: fixed; top: 16px; right: 16px; width: 240px; max-height: calc(100% - 32px); overflow-y: auto;
    background: rgba(20,20,20,.85); border: 1px solid #333; border-radius: 8px; padding: 12px 14px; font-size: 12px; box-sizing: border-box; }
  #panel h3 { margin: 0 0 8px; font-size: 13px; display: flex; justify-content: space-between; }
  #panel h4 { margin: 12px 0 4px; font-size: 11px; opacity: .6; font-weight: 500; }
  #panel button { background: #333; color: #eee; border: 0; border-radius: 4px; padding: 2px 8px; cursor: pointer; font-size: 11px; }
  .row { margin: 6px 0; }
  .row label { display: flex; justify-content: space-between; }
  .row input { width: 100%; accent-color: #d8261b; }
  .camBtns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0 4px; }
  #panel .camBtns button { padding: 6px 0; font-size: 12px; user-select: none; touch-action: none; }
  #panel .camBtns button:active { background: #d8261b; }
  #panel.hidden .body { display: none; }
  /* 朋友測試版（<body data-build="public">）：藏起開發用的面板、鏡頭軌、FPS；按 H 仍可打開面板 */
  body[data-build="public"] #panel:not(.open), body[data-build="public"] #camRail { display: none; }
</style>
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                 "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body data-build="public">
<div id="timer">0 － 0</div>
<div id="hud">
  <div class="card" id="card0">
    <div class="name"><i style="background:#e8a07a"></i><span data-i18n="you">你</span></div>
    <div class="gauge"></div>
    <div class="wins"></div>
  </div>
  <div class="card" id="card1">
    <div class="name"><i style="background:#5b82c0"></i>CPU</div>
    <div class="gauge"></div>
    <div class="wins"></div>
  </div>
</div>
<div id="hint" data-i18n="hint"></div>
<div id="grade"></div>
<div id="vig"></div>
<div id="flash"></div>
<div id="msg"></div>
<div id="fps"></div>
<button id="langBtn" title="Language / 語言 (L)">EN</button>
<div id="loading"><div class="t">SUMO</div><div class="bar"><i></i></div><div class="s" data-i18n="loading">載入中…</div></div>
<div id="camRail" title="鏡頭高度：拖動、滾輪或按住 ▲▼（Q / E）">
  <div class="cap">鏡頭高度</div>
  <button data-d="1">▲</button>
  <div class="track"><div class="fill"></div><div class="thumb"></div></div>

</div>
<div id="pause">
  <div class="title" data-i18n="paused">暫停</div>
  <div class="sub" data-i18n="resume">按 P 或 Esc 繼續</div>
</div>
<div id="panel" class="hidden">
  <h3>調整 <button id="resetParams">預設值</button></h3>
  <div class="body"><div id="sliders"></div></div>
</div>

<script type="module">
import * as THREE from 'three';
// =====================================================================
// 中英文切換：畫面上給玩家看的文字都在這裡（調整面板是開發用的，維持中文）
// =====================================================================
const I18N = {
  zh: {
    you: '你', cpu: 'CPU', loading: '載入中…', paused: '暫停', resume: '按 P 或 Esc 繼續',
    hint: '方向鍵 移動（快按兩下 + D = 突進）　·　W 跳躍（空中再按 = 上升技）　·　D 攻擊（連按連段／空中迴旋踢）<br>' +
          'A 重擊（按住蓄力，可用方向鍵轉向；空中為下墜重擊）　·　S 翻滾　·　空白鍵 嘲諷（按住繼續跳）<br>' +
          '抓邊後自動攀爬，期間可先按 W／D／S 決定上來方式　|　P 暫停　·　R 重新開始　·　L English',
    roundWin: w => `${w === 'you' ? '你' : 'CPU'} 拿下這局`,
    matchWin: (w, a, b) => `${w === 'you' ? '你贏了' : 'CPU 獲勝'}　${a} － ${b}\n按 R 再來一場`,
    worst: '最慢', langBtn: 'EN',
  },
  en: {
    you: 'YOU', cpu: 'CPU', loading: 'Loading…', paused: 'PAUSED', resume: 'Press P or Esc to resume',
    hint: 'Arrows Move (double-tap + D = Dash)　·　W Jump (again in air = Rising Special)　·　D Attack (combo / air Spin Kick)<br>' +
          'A Heavy (hold to charge, steer with arrows; in air = Slam)　·　S Roll　·　Space Taunt (hold to keep dancing)<br>' +
          'On the ledge you climb up automatically — press W / D / S early to choose how　|　P Pause　·　R Restart　·　L 中文',
    roundWin: w => `${w === 'you' ? 'YOU TAKE' : 'CPU TAKES'} THE ROUND`,
    matchWin: (w, a, b) => `${w === 'you' ? 'YOU WIN' : 'CPU WINS'}　${a} – ${b}\nPress R for a rematch`,
    worst: 'worst', langBtn: '中文',
  },
};
let LANG = (() => {
  try { const v = localStorage.getItem('sumo-lang'); if (v === 'zh' || v === 'en') return v; } catch (e) {}
  return /^zh/i.test(navigator.language || '') ? 'zh' : 'en';      // 第一次開：跟著瀏覽器語言
})();
const tr = k => I18N[LANG][k];
function applyLang() {
  document.documentElement.lang = LANG === 'zh' ? 'zh-Hant' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = tr(el.dataset.i18n); });
  document.getElementById('langBtn').textContent = tr('langBtn');
}
function toggleLang() {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  try { localStorage.setItem('sumo-lang', LANG); } catch (e) {}
  applyLang();
}
document.getElementById('langBtn').addEventListener('click', e => { toggleLang(); e.currentTarget.blur(); });
applyLang();
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

// =====================================================================
// 可調參數
// =====================================================================
const DEFAULTS = {
  accel: 30, damping: 4, airControl: 0.5, jumpPower: 9.5, airG: 24,
  gravity: 9.8, tiltGain: 0.04, tiltMax: 0.14, tiltStiff: 25, tiltDamp: 6, tiltKB: 1.5, landKick: 0.12,
  bearPerEdge: 8, cornerHit: 60, collapseTime: 5, protectTime: 4, collapseAngle: 0.2, collapsePull: 12,
  kbScale: 1, dmgScale: 1, hitstunScale: 1, blastDist: 9, ledgeWait: 2.4, ledgeSlow: 0.5, roundsToWin: 2,
  cpuLevel: 4,
  platW: 13.1, platD: 7.8, thick: 0.35,
  brightness: 1.75, camY: 18.5, camDist: 27, camZoomMin: 0.72, animAmp: 1.35, resScale: 1.25,
};
const CAM_Y_MIN = 1, CAM_Y_MAX = 60;
const GROUPS = [
  ['畫面', { resScale: ['畫面解析度（越低越順）', 0.6, 2, 0.05], brightness: ['亮度', 0.2, 2.5, 0.05], camDist: ['鏡頭水平距離 Z / X', 8, 50, 0.5],
    camZoomMin: ['鏡頭最近距離（越小越近）', 0.4, 1.5, 0.01],
    animAmp: ['攻擊動作幅度（1 = 原始動作）', 1, 2, 0.05] }],
  ['戰鬥', {
    kbScale: ['擊飛力道倍率', 0.5, 2, 0.05], dmgScale: ['傷害倍率', 0.5, 2, 0.05],
    hitstunScale: ['受擊硬直倍率', 0.5, 2, 0.05], blastDist: ['出界線離平台邊緣的距離', 4, 18, 0.5],
    ledgeWait: ['抓邊後攀爬時間（秒，期間可被震下）', 0.5, 4, 0.1],
    ledgeSlow: ['有人掛邊時的遊戲速度（1 = 不放慢）', 0.2, 1, 0.05],
    roundsToWin: ['贏幾局獲勝（下一場生效）', 1, 3, 1] }],
  ['CPU', { cpuLevel: ['CPU 等級', 1, 9, 1] }],
  ['移動', {
    accel: ['加速度', 10, 60, 1], damping: ['地面阻力', 1, 8, 0.1], airControl: ['空中控制', 0.1, 1, 0.05],
    jumpPower: ['跳躍力道', 5, 14, 0.5], airG: ['下墜重力', 10, 40, 1] }],
  ['角落塌陷', {
    cornerHit: ['重擊累積的壓力', 10, 150, 1], collapseTime: ['塌陷持續（秒）', 1, 10, 0.5],
    protectTime: ['恢復後的保護時間（秒）', 0, 10, 0.5], collapseAngle: ['塌陷傾斜角度', 0.05, 0.45, 0.01],
    collapsePull: ['塌陷時往角落拉的力量', 0, 40, 0.5], bearPerEdge: ['每邊扛的人數（畫面）', 3, 12, 1] }],
  ['平台傾斜', {
    tiltGain: ['傾斜靈敏度', 0, 0.1, 0.005], tiltMax: ['最大傾斜', 0.05, 0.5, 0.01],
    tiltKB: ['順著斜坡打的擊飛加成', 0, 4, 0.1], gravity: ['斜面重力', 0, 25, 0.5],
    tiltStiff: ['反應速度', 4, 80, 1], tiltDamp: ['晃動阻尼', 0.5, 20, 0.5], landKick: ['落地／重擊壓平台', 0, 0.5, 0.01] }],
  ['平台形狀', {
    platW: ['左右角長度（半長）', 6, 18, 0.1], platD: ['前後角長度（半長）', 4, 12, 0.1], thick: ['厚度', 0.05, 1, 0.05] }],
];
const P = { ...DEFAULTS };

const BODY_R = 0.38;        // 身體互相擠開的半徑
const MAX_FALL = 13;
const BLAST_DOWN = 11, BLAST_UP = 17;   // 往下、往上的出界線
// 出界：四個方向都是「離平台邊緣固定距離」，不再因為前後角比較短就特別容易出局
const outOfBounds = (x, y, z) => edgeDist(x, z) < -P.blastDist || y < -BLAST_DOWN || y > BLAST_UP;
const EDGE_HOLD = 0.3;      // 走到邊緣時的保護時間（秒）
const LEDGE_Y = -2.0;
// 開場：兩人從天而降（下墜重擊的動作），落地重擊後接 Sumo High Pull 站穩，比賽才開始
const INTRO = { height: 11, cpuDelay: 0.22, smash: 0.22, pullSpeed: 0.8, after: 0.15, maxTime: 6 };
const CLIMB_DUR = { up: 0.35, atk: 0.2, roll: 0.2 };   // 攀爬時間到之後，最後一步站上平台的時間（全程無敵）：一般／出擊／翻滾
const HANG_OFF = { y: -0.31, z: 0.62 };   // 骨架人物掛邊時的位置修正（往下、往平台內）   // 爬上來的時間（全程無敵）：一般／出擊／翻滾       // 抓邊時腳的高度（手剛好搭在平台邊緣）
const GAUGE_STEP = 15;      // 量表每一格 = 15 點內部受傷值（10 格 = 150）

// 招式表：startup 起手、active 判定、recovery 收招（秒）；bkb 基礎擊飛、kbg 每 1% 增加的擊飛；angle 擊飛仰角
const MOVES = {
  // D 系列（light）：距離長、出手快、傷害累積用，擊飛成長低，不太能把人打出去
  //   whiff：打空時的收招；hs：被打中的人固定的硬直（很短，下一段出手前就恢復，可以用 S 翻滾逃開）
  jab1:   { startup: .06, active: .07, recovery: .15, whiff: .25, hs: .10, dmg: 4, bkb: 2.2, kbg: .010, angle: 15, reach: 1.45, arc: 1.0, v: 1.2, step: 1.5, next: 'jab2', light: true },
  jab2:   { startup: .12, active: .07, recovery: .15, whiff: .25, hs: .10, dmg: 4, bkb: 2.2, kbg: .010, angle: 15, reach: 1.45, arc: 1.0, v: 1.2, step: 1.5, next: 'jab3', light: true },
  jab3:   { startup: .16, active: .09, recovery: .28, whiff: .40, dmg: 7,  bkb: 5.5, kbg: .03,  angle: 35, reach: 1.6,  arc: 1.0, v: 1.2, step: 2.5, light: true },
  // 突進（快速按兩下方向鍵 + D）：往那個方向衝出去，把人往前推飛一段
  dash:   { startup: .08, active: .16, recovery: .32, whiff: .45, dmg: 6, bkb: 7.5, kbg: .03, angle: 28, reach: 1.35, arc: 1.1, v: 1.2, step: 6.5, light: true },
  // A 重擊：距離短、起手慢、打空破綻大；低 % 打不遠，高 % 的擊飛成長很高，負責收尾
  strong: { startup: .16, active: .10, recovery: .30, whiff: .40, dmg: 11, dmgMax: 17, bkb: 4.5, kbg: .13, kbgMax: .16, angle: 38,
            reach: 1.2, arc: 0.9, v: 1.3, step: 0.6, chargeMax: 1.0, stomp: 1 },
  air:    { startup: .07, active: .22, recovery: .16, dmg: 7,  bkb: 5,   kbg: .05,  angle: 38, reach: 1.35, arc: Math.PI, v: 1.3, light: true },
  slam:   { startup: .20, active: 9,   recovery: .36, dmg: 12, bkb: 7.5, kbg: .09,  angle: 65, reach: 1.3,  arc: Math.PI, v: 1.6, yOff: -0.5, plunge: -18, stomp: 2.5 },
  taunt:  { startup: 0, active: 99, recovery: 0, min: 1.2 },   // 嘲諷：至少跳 1.2 秒，按住空白鍵就繼續跳；沒有攻擊判定，被打會中斷
  getupAtk: { startup: .03, active: .12, recovery: .30, dmg: 7, bkb: 8.5, kbg: .03, angle: 32, reach: 1.8, arc: 1.5, v: 1.2, light: true },   // 從邊緣爬上來的同時出一擊，把守邊的人打退
  shake:  { dmg: 15, bkb: 6, kbg: .04, angle: 48 },   // 被震飛：量表加一整格（15），之後更容易被打飛   // 下墜重擊震到掛邊的人：把他往外打飛
  upSpec: { startup: .05, active: .32, recovery: .12, dmg: 6,  bkb: 6,   kbg: .05,  angle: 72, reach: 1.2,  arc: Math.PI, v: 1.5, yOff: 0.5, rise: 15 },
  grab:   { startup: .10, active: .07, recovery: .36, reach: 1.15, arc: 0.8, v: 1.0, grab: true },
  throw:  { dmg: 8, bkb: 8.5, kbg: .06, angle: 42 },
};

// =====================================================================
// 場景
// =====================================================================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.25));   // 高解析度螢幕不用到 2 倍，省下大量繪製（可在面板調整）
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070b14);          // 道場：深藍黑的空間
scene.fog = new THREE.Fog(0x070b14, 42, 105);

const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 200);
const CAM_AZIM = 45 * Math.PI / 180;
const CAM_BASE = new THREE.Vector3();
let camLookY = 0, aspectK = 1;
function updateCamBase() {
  CAM_BASE.set(Math.sin(CAM_AZIM) * P.camDist, P.camY, Math.cos(CAM_AZIM) * P.camDist);
  const elevDeg = Math.atan2(P.camY, P.camDist) * 180 / Math.PI;
  camLookY = Math.max(0, 2.4 - (elevDeg - 20) * 0.1);
}

const hemi = new THREE.HemisphereLight(0xd4def5, 0x14161e, 1);     // 偏冷的環境光（參考道場畫面）
const fill = new THREE.DirectionalLight(0xe4ecff, 1);
fill.position.set(12, 8, 12);
scene.add(hemi, fill);
const spot = new THREE.SpotLight(0xfff7f0, 1, 80, Math.PI / 5.2, 0.9, 2);   // 頂光：柔和的大光圈，中間亮、往邊緣暗下去
spot.position.set(2, 24, 2);
spot.castShadow = true;
spot.shadow.mapSize.set(2048, 2048);

function loadTatami() {

      const rib = Math.pow(Math.sin(Math.PI * ph), 0.8);    // 中間鼓起、條與條之間凹下
      const ribTone = ribVar[Math.floor(y / ribPx)];        // 每一條草的顏色略有不同（天然材料）
      const inHeri = y < border || y >= N - border;

    for (const yb of [border, N - border - 1]) for (let x = 0; x < N; x++) { const k = yb * N + x; H[k] -= 0.3; }
    const mk = fill => { const cv = document.createElement('canvas'); cv.width = cv.height = N; const c = cv.getContext('2d'); const im = c.createImageData(N, N); fill(im.data); c.putImageData(im, 0, 0); return cv; };
    const colCv = mk(d => { for (let k = 0; k < n; k++) { d[k * 4] = Math.min(255, Math.pow(C[k * 3], 1 / 2.2) * 255); d[k * 4 + 1] = Math.min(255, Math.pow(C[k * 3 + 1], 1 / 2.2) * 255); d[k * 4 + 2] = Math.min(255, Math.pow(C[k * 3 + 2], 1 / 2.2) * 255); d[k * 4 + 3] = 255; } });
    const nrmCv = mk(d => {                                 // 高度 → 法線（凹凸）

  if (c.airAtk > 0) { c.airAtk -= dt; if (c.airAtk <= 0 && !me.ground) c.press('atk'); }
  if (c.airSlam > 0) { c.airSlam -= dt; if (c.airSlam <= 0 && !me.ground) c.press('strong'); }

  const oOff = o.ledge || (!o.ground && (rhombus(o.x, o.z) > 1 || o.y < 0));
  const canDecide = me.ground && !me.move && me.hitstun <= 0 && me.lag <= 0 && me.dizzy <= 0;

  if (oOff) {                            // 守邊：站在對手要回來的邊緣內側
    const E = edgeInfo(o.x, o.z);
    const tx = E.px - E.nx * 1.3, tz = E.pz - E.nz * 1.3;
    const ex = tx - me.x, ez = tz - me.z, el = Math.hypot(ex, ez);
    if (el > 0.4) { c.mx = ex / el; c.mz = ez / el; }
    c.think -= dt;
    // 對手掛在邊緣：跳起來用下墜重擊把他震下去
    if (canDecide && c.think <= 0 && d > 5 && edgeDist(me.x, me.z) > 2.5 && Math.random() < 0.06) { c.think = 1; c.press('taunt'); return; }   // 對手離很遠：偶爾嘲諷
    if (canDecide && c.think <= 0 && o.ledge && !o.ledge.climb && Math.hypot(o.ledge.hx - me.x, o.ledge.hz - me.z) < 1.9 && Math.random() < 0.25 + 0.5 * s) {
      c.think = 0.9; c.press('jump'); c.airSlam = 0.2; c.mx = c.mz = 0;
      return;
    }
    if (canDecide && c.think <= 0 && d < 1.8 && Math.abs(o.y - me.y) < 1.3 && !isInvuln(o) && !o.ledge) {
      c.think = 0.2 + (1 - s) * 0.4;
      if (Math.random() < 0.4 + 0.3 * s) { c.press('strong'); c.chargeT = 0.05; } else { c.press('atk'); c.jabs = 2; }
    }
    return;
  }

  // 自己在塌陷中的角附近：先離開
  for (const cc of corners) if (cc.down > 0 && cornerW(cc, me.x, me.z) > 0.2) { c.mx = -cc.dx; c.mz = -cc.dz; return; }
  // 一般對峙：接近到出手距離，太近就退
  if (d > 1.4) { c.mx = ux; c.mz = uz; } else if (d < 0.7) { c.mx = -ux; c.mz = -uz; }
  if (edgeDist(me.x, me.z) < 1.0) {       // 自己靠近邊緣：往中心靠
    c.mx += tcx * 0.9; c.mz += tcz * 0.9;
    const l = Math.hypot(c.mx, c.mz) || 1; c.mx /= l; c.mz /= l;
  }
  // 連段：打中了就繼續按
  if (me.move && me.move.id.startsWith('jab') && me.move.hit && c.jabs > 0 && !(c.buf.atk > 0)) { c.press('atk'); c.jabs--; }

  c.think -= dt;
  if (!canDecide || c.think > 0) return;
  c.think = 0.1 + (1 - s) * 0.45 + Math.random() * 0.15;
  const vuln = o.dizzy > 0 || (om && om.phase === 'recovery') || o.lag > 0.1;
  const r = Math.random();
  if (d < 1.85 && Math.abs(o.y - me.y) < 1.0) {
    const nearHot = corners.some(cc => (cc.down > 0 || cc.p > 35) && cornerW(cc, o.x, o.z) > 0.25);
    if (o.shielding) { c.press('atk'); c.jabs = 2; return; }                    // 對手防禦：用 D 打穿
    const finish = o.pct > 85;                                                    // 高 % 才用重擊收尾
    if (nearHot && r < 0.3 + 0.5 * s) { c.press('strong'); c.chargeT = 0.85 + Math.random() * 0.35; }   // 對手在快塌的角：蓄力過半的重擊（按住時間含 0.16 秒起手）
    else if (vuln && d < 1.4 && r < 0.4 + 0.4 * s) { c.press(finish ? 'strong' : 'atk'); c.chargeT = 0.05; c.jabs = 2; }   // 對手有破綻：懲罰
    else if (finish && d < 1.4 && r < 0.45) { c.press('strong'); c.chargeT = Math.random() < 0.4 ? 0.95 : 0.1; }
    else if (r < 0.75) { c.press('atk'); c.jabs = 2; }                            // 平常用 D 累積傷害
    else if (r < 0.82) { c.press('strong'); c.chargeT = 0.95; }                    // 偶爾蓄力硬吃
    else c.roll = { x: -ux, z: -uz, t: 0.3 };                                    // 偶爾後退拉開距離
  } else if (d > 2 && d < 4 && r < 0.35) {
    c.lungeDir = { x: ux, z: uz }; c.press('lunge');   // 中距離：朝對手突進
  } else if (!o.ground && d < 2.4 && o.y > 0.8 && r < 0.3 + 0.4 * s) {
    c.press('jump'); c.airAtk = 0.18;     // 對手在空中：跳起來追打
  }
}

// =====================================================================
// 物理與戰鬥
// =====================================================================
const tilt = { x: 0, z: 0, vx: 0, vz: 0, y: 0, vy: 0 };   // y：平台整體下沉量
const clampV = (v, lim) => Math.max(-lim, Math.min(lim, v));
let hitStop = 0, shake = 0, slowT = 0;

function stepTilt(dt) {
  // 平常：依選手位置輕微傾斜；角落塌陷時再加上往那一角的大幅傾斜
  let mx = 0, mz = 0;
  for (const f of fighters) if (f.ground && f.dead <= 0 && !f.out) { mx += f.weight * f.x; mz += f.weight * f.z; }
  const col = collapseTilt();
  const targetZ = clampV(-P.tiltGain * mx, P.tiltMax) + col.tz;
  const targetX = clampV( P.tiltGain * mz, P.tiltMax) + col.tx;
  tilt.vz += (P.tiltStiff * (targetZ - tilt.z) - P.tiltDamp * tilt.vz) * dt;
  tilt.vx += (P.tiltStiff * (targetX - tilt.x) - P.tiltDamp * tilt.vx) * dt;
  tilt.vy += (P.tiltStiff * (col.ty - tilt.y) - P.tiltDamp * tilt.vy) * dt;
  tilt.z += tilt.vz * dt; tilt.x += tilt.vx * dt; tilt.y += tilt.vy * dt;
}
// 在 (x, z) 往下壓平台一下
function kickTilt(x, z, amt, cornerAmt = 0) {
  joltBearers(x, z, amt);                // 扛的人被震一下（膝蓋一軟再頂回來）
  tilt.vz += -P.landKick * x * amt;
  tilt.vx +=  P.landKick * z * amt;
  hurtBearers(x, z, cornerAmt);          // 角落壓力（站著、普通落地不算）
}

const isInvuln = f => f.invuln > 0 ||
  (f.roll && f.roll.t > 0.04 && f.roll.t < 0.27) ||
  (f.dodge && f.dodge.t > 0.03 && f.dodge.t < 0.3) ||
  (f.ledge && f.ledge.climb);

let moveSeq = 0;
function startMove(f, id) {
  const d = MOVES[id];
  f.move = { id, def: d, phase: 'startup', pt: 0, hit: false, charge: 0, queued: false, uid: ++moveSeq };
  if (id === 'slam') { f.vy = 2.5; f.vx *= 0.4; f.vz *= 0.4; }
  if (d.step && f.ground) { f.vx += Math.sin(f.yaw) * d.step; f.vz += Math.cos(f.yaw) * d.step; }
}
function enterActive(f, c) {
  const m = f.move, d = m.def;
  m.phase = 'active'; m.pt = 0;
  if (m.id === 'strong' && f.ground) {
    if (Math.hypot(c.mx, c.mz) > 0.3) f.yaw = Math.atan2(c.mx, c.mz);   // 不額外往前衝，保持「D 比 A 打得遠」
  }
  if (m.id === 'slam') { f.vy = d.plunge; f.vx = f.vz = 0; }
  if (m.id === 'upSpec') {
    f.ground = false; f.y = Math.max(f.y, 0.001); f.vy = d.rise; f.specUsed = true;
    f.vx = c.mx * 6.5; f.vz = c.mz * 6.5;   // 上升技可以帶比較多的水平距離，方便回場
  }
  if (m.id === 'strong') kickTilt(f.x, f.z, d.stomp * (1 + m.charge), m.charge > 0.5 ? 1 + m.charge : 0);   // 只有蓄力過半的重擊才算角落壓力
}
function releaseGrab(f) {
  if (f.opp.grabbedBy === f) f.opp.grabbedBy = null;
}
function stepMove(f, c, dt) {
  const m = f.move, d = m.def;
  m.pt += dt;
  if (m.id === 'taunt') {                 // 嘲諷：跳到放開空白鍵（至少 1.2 秒），或整段跳完
    m.phase = 'active';
    const len = rigAssets.clips.taunt ? rigAssets.clips.taunt.duration - 0.1 : 1.6;
    if ((m.pt >= d.min && !c.tauntHeld) || m.pt >= len) { f.move = null; f.lag = 0.1; }
    return;
  }
  // A：起手和蓄力時可以用方向鍵轉向；出手的瞬間朝按著的方向打出去
  if (m.id === 'strong' && (m.phase === 'startup' || m.phase === 'charge') && f.ground && Math.hypot(c.mx, c.mz) > 0.3)
    turnTo(f, Math.atan2(c.mx, c.mz), 10, dt);
  if (m.phase === 'startup') {
    if (m.pt >= d.startup) {
      if (d.chargeMax && c.strongHeld) { m.phase = 'charge'; m.pt = 0; } else enterActive(f, c);
    }
  } else if (m.phase === 'charge') {
    m.charge = Math.min(1, m.pt / d.chargeMax);
    if (!c.strongHeld || m.pt >= d.chargeMax) enterActive(f, c);
  } else if (m.phase === 'active') {
    if (d.next && c.take('atk')) m.queued = true;
    if (m.id === 'slam') {
      if (f.ground) { m.phase = 'recovery'; m.pt = 0; shakeLedge(f); kickTilt(f.x, f.z, d.stomp, 1.2); shake = Math.max(shake, 0.3); puff(f.x, 0.1, f.z, { size: 0.5, life: 0.3, grow: 6, opacity: 0.5 }); }
    } else if (m.pt >= d.active) { m.phase = 'recovery'; m.pt = 0; }
  } else if (m.phase === 'recovery') {
    if (d.next && c.take('atk')) m.queued = true;
    if (m.pt >= (d.whiff && !m.hit ? d.whiff : d.recovery) + (m.extraLag || 0)) {     // 重擊打空、被防禦擋下：收招更久
      if (m.queued && d.next && f.ground) startMove(f, d.next);
      else f.move = null;
    }
  } else if (m.phase === 'hold') {       // 抓住對手：0.45 秒後往按的方向投出
    if (m.pt >= 0.45) {
      const t = f.opp;
      let dx = c.mx, dz = c.mz, l = Math.hypot(dx, dz);
      if (l < 0.3) { dx = Math.sin(f.yaw); dz = Math.cos(f.yaw); l = 1; }
      dx /= l; dz /= l;
      f.yaw = Math.atan2(dx, dz);
      f.move = { id: 'throwRec', def: { recovery: 0.28 }, phase: 'recovery', pt: 0, hit: true };
      if (t.grabbedBy === f) {
        t.grabbedBy = null;
        t.x = f.x + dx * 0.7; t.z = f.z + dz * 0.7; t.y = f.y + 0.3; t.ground = false;
        applyHit(f, t, MOVES.throw, dx, dz, 0);
      }
    }
  }
}

let ledgeClock = 1;   // 掛邊的計時用實際時間：遊戲放慢時，倒數條仍然是實際的 2 秒
// 有人掛在邊緣（還沒開始爬上來）
const someoneHanging = () => fighters.some(f => f.ledge && !f.ledge.climb && f.dead <= 0);
const isArmored = f => f.move && f.move.id === 'strong' && f.move.phase === 'charge' && f.move.charge > 0.5;
function applyHit(a, t, d, dirx, dirz, charge) {
  const dmg = (d.dmgMax ? d.dmg + (d.dmgMax - d.dmg) * charge : d.dmg) * P.dmgScale;
  t.pct += dmg;
  if (d.light && isArmored(t)) {         // 蓄力過半的重擊：被 D 系列打中只受傷、不會被打斷
    hitStop = 0.05; shake = Math.max(shake, 0.12);
    spark((a.x + t.x) / 2, t.y + 1.1, (a.z + t.z) / 2, 2, 0xffd27a);
    return;
  }
  const kbg = d.kbgMax ? d.kbg + (d.kbgMax - d.kbg) * charge : d.kbg;
  let kb = (d.bkb + kbg * t.pct) * P.kbScale / t.weight;
  // 順著平台下沉的方向打，飛得更遠；逆著打則較近
  const [skx, skz] = sinkAt(t.x, t.z);   // 被打向塌陷的角，飛得更遠
  const along = dirx * -Math.sin(tilt.z) + dirz * Math.sin(tilt.x) + (dirx * skx + dirz * skz) * 0.5;
  kb *= Math.max(0.7, Math.min(1.6, 1 + P.tiltKB * along));
  const ang = d.angle * Math.PI / 180;
  t.vx = dirx * kb * Math.cos(ang); t.vz = dirz * kb * Math.cos(ang); t.vy = kb * Math.sin(ang);
  if (t.ground) { if (t.vy > 1.5) { t.ground = false; t.y = 0.02; } else t.vy = 0; }
  t.hitstun = d.hs ?? Math.min(1.6, 0.1 + kb * 0.035 * P.hitstunScale);
  if (t.move && t.move.id === 'hold') releaseGrab(t);
  t.move = null; t.roll = null; t.dodge = null; t.ledge = null; t.shielding = false; t.helpless = false;
  t.yaw = Math.atan2(-dirx, -dirz);
  t.hitX = dirx * kb; t.hitZ = dirz * kb; t.hitT = 1; t.hitSeq++;
  hitStop = Math.min(0.2, 0.03 + dmg * 0.007);
  shake = Math.max(shake, Math.min(0.7, kb * 0.035));
  spark((a.x + t.x) / 2, t.y + 1.1, (a.z + t.z) / 2, kb);
  // 千鈞一髮：這一擊足以出局（或飛到很難回來的位置）→ 短暫慢動作、鏡頭拉近被打飛的人
  if (game.state === 'play' && !t.closeCall && predictDanger(t)) {
    t.closeCall = true; slowT = Math.max(slowT, 0.45); camFocus.f = t; camFocus.t = 0.9;
  }
}

function processHits(a, t) {
  const m = a.move;
  if (!m || m.phase !== 'active' || m.hit) return;
  const d = m.def;
  if (!d.dmg && !d.grab) return;
  if (t.dead > 0 || t.out || t.grabbedBy || isInvuln(t)) return;
  if (t.ledge && m.id === 'slam') return;   // 下墜重擊對掛邊的人只有「震落」，不造成傷害
  const dx = t.x - a.x, dz = t.z - a.z, dist = Math.hypot(dx, dz);
  if (dist > d.reach + BODY_R) return;
  if (Math.abs(t.y - (a.y + (d.yOff || 0))) > d.v) return;
  if (d.arc < Math.PI && dist > 0.05) {
    if ((dx * Math.sin(a.yaw) + dz * Math.cos(a.yaw)) / dist < Math.cos(d.arc)) return;
  }
  m.hit = true;
  const dirx = dist > 0.05 ? dx / dist : Math.sin(a.yaw), dirz = dist > 0.05 ? dz / dist : Math.cos(a.yaw);
  if (d.grab) {                          // 抓取：無視防禦
    if (t.move && t.move.id === 'hold') releaseGrab(t);
    t.grabbedBy = a; t.move = null; t.roll = null; t.shielding = false; t.hitstun = 0; t.ledge = null;
    a.move = { id: 'hold', def: {}, phase: 'hold', pt: 0, hit: true };
    return;
  }
  // 防禦：D 系列（light）直接打穿；其他招式被擋下 → 不會被打飛，量表只累積一半；
  //        防禦方稍微往後滑（在邊緣一直防禦還是會被慢慢推出去）；攻擊方被彈開並多 0.25 秒收招，防禦方可以反擊
  if (t.shielding && !d.light) {
    const dmg = (d.dmgMax ? d.dmg + (d.dmgMax - d.dmg) * m.charge : d.dmg) * P.dmgScale;
    t.pct += dmg * 0.5;
    t.shieldStun = 0.12 + dmg * 0.01;
    t.vx += dirx * (1.8 + dmg * 0.15); t.vz += dirz * (1.8 + dmg * 0.15);
    a.vx -= dirx * 3; a.vz -= dirz * 3;
    m.extraLag = m.id === 'strong' ? 0.22 : 0.25;   // A 被擋下：多 0.22 秒收招（仍然來得及被 D 反擊）
    hitStop = 0.07; shake = Math.max(shake, 0.2);
    spark((a.x + t.x) / 2, t.y + 1.0, (a.z + t.z) / 2, 4, 0xbfe3ff);
    return;
  }
  applyHit(a, t, d, dirx, dirz, m.charge);
}
function breakShield(f) {                // 破防：彈起後暈眩
  f.shielding = false; f.shieldStun = 0; f.shield = 40;
  f.dizzy = 2.6; f.ground = false; f.y = 0.02; f.vy = 5.5; f.vx = f.vz = 0;
  shake = Math.max(shake, 0.4);
  spark(f.x, 1.2, f.z, 8, f.accent);
}

function land(f) {
  const impact = Math.min(1.5, -f.vy / 10);
  f.y = 0; f.vy = 0; f.ground = true;
  f.airJumps = 1; f.specUsed = false; f.dodgeUsed = false; f.helpless = false; f.dodge = null;
  f.landT = Math.min(1, impact);
  if (game.state === 'intro') {            // 開場落地：地面震動、揚起塵土
    shake = Math.max(shake, 0.55); hitStop = Math.max(hitStop, 0.05);
    for (let i = 0; i < 12; i++) {
      const a = i / 12 * Math.PI * 2;
      puff(f.x, 0.1, f.z, { color: 0xc8beb0, size: 0.28, life: 0.6, grow: 2.5, opacity: 0.5, vx: Math.cos(a) * 4, vy: 0.8, vz: Math.sin(a) * 4 });
    }
  }
  f.ledgeCount = 0;
  if (f.closeCall) saved(f);
  kickTilt(f.x, f.z, impact);            // 落地不算角落壓力
  if (f.hitstun > 0) { f.hitstun = Math.min(f.hitstun, 0.3); f.lag = Math.max(f.lag, 0.25); }
  if (f.move && f.move.id !== 'slam') {
    if (f.move.id === 'air') f.lag = Math.max(f.lag, 0.1);
    if (f.move.id === 'upSpec') f.lag = Math.max(f.lag, 0.22);
    if (!f.move.def.step) f.move = null;       // 空中招式落地取消
  }
}

function tryLedge(f, dt) {
  if (f.ground || f.vy > 4 || f.hitstun > 0.15 || f.ledgeCd > 0 || f.dizzy > 0) return;
  if (f.move && f.move.id === 'slam') return;
  const ed = edgeDist(f.x, f.z);
  // 吸附：下墜時靠近邊緣，會被輕輕拉向抓邊的位置
  if (f.vy < 0 && ed < 0 && ed > -2.2 && f.y < 0.4 && f.y > LEDGE_Y - 2) {
    const l = Math.hypot(f.x, f.z) || 1;
    f.vx -= f.x / l * 9 * dt; f.vz -= f.z / l * 9 * dt;
  }
  if (f.y < LEDGE_Y - 1.3 || f.y > LEDGE_Y + 1.7) return;       // 上下範圍（原本 -0.7 ～ +1.2）
  if (ed > 0.1 || ed < -1.2) return;                             // 左右範圍（原本 0.75）
  const o = f.opp;
  if (o.ledge && Math.hypot(o.x - f.x, o.z - f.z) < 1.5) return;   // 邊緣已經有人
  const E = edgeInfo(f.x, f.z), px = E.px, pz = E.pz;
  const nx = -E.nx, nz = -E.nz;           // 往平台內的方向（和邊垂直）
  f.ledge = { t: 0, climb: false, ct: 0, getup: null, hx: px - nx * 0.28, hz: pz - nz * 0.28, ix: px + nx * 0.8, iz: pz + nz * 0.8, nx, nz,
    sx: f.x, sy: f.y, sz: f.z };          // sx/sy/sz：抓到時的位置，用來平滑移到掛邊位置
  f.vx = f.vz = f.vy = 0; f.move = null; f.dodge = null; f.hitstun = 0;
  f.airJumps = 1; f.specUsed = false; f.dodgeUsed = false; f.helpless = false;
  // 連續抓邊（中間沒踩回平台）無敵時間遞減，避免一直掛著拖時間
  f.invuln = Math.max(f.invuln, [0.6, 0.3, 0][Math.min(2, f.ledgeCount)]);
  f.ledgeCount++;
  if (f.closeCall) saved(f);
}
// 下墜重擊落在邊緣附近：把掛在那裡的人震飛出去（無視抓邊無敵；飛多遠看他的量表）
function shakeLedge(a) {
  const o = a.opp, L = o.ledge;
  if (!L || L.climb || L.t < 0.3) return;                         // 剛抓到 0.3 秒內不會被震下
  if (Math.hypot(a.x - L.hx, a.z - L.hz) > 2.2) return;
  releaseLedgeVisual(o);
  applyHit(a, o, MOVES.shake, -L.nx, -L.nz, 0);                    // 往平台外、往上打飛
  o.ledgeCd = 0.8; o.invuln = 0;
  o.specUsed = false; o.helpless = false;                          // 被震飛的人還能用一次上升技回場
  shake = Math.max(shake, 0.5);
  spark(L.hx, 0.1, L.hz, 8);
}

// 攀爬中被震下或放手：把角色的位置移到身體實際所在的地方（爬到一半的高度），避免瞬間掉回原本掛著的位置
function releaseLedgeVisual(f) {
  const L = f.ledge;
  if (!L || L.climb || !f.model || !rigAssets.climbRoot) return;
  const off = rigAssets.climbRoot(ledgeClipTime(L));
  const k = Math.min(1, L.t / 0.1);
  f.y = LEDGE_Y + (HANG_OFF.y * k + off.dy);
  const fwd = Math.min(HANG_OFF.z * k + off.dz, 0.25);      // 不要直接把人放進平台裡
  f.x = L.hx + L.nx * fwd; f.z = L.hz + L.nz * fwd;
}
// 攀爬時間內播放到「爬上來」動作的哪裡：拉上去（約一半時間）→ 跪在邊緣、準備站起
const LEDGE_MAP = [[0, 0.3], [0.55, 1.6], [1, 3.6]];
function ledgeClipTime(L) {
  const p = Math.min(1, L.t / Math.max(0.01, P.ledgeWait));
  for (let i = 1; i < LEDGE_MAP.length; i++) if (p <= LEDGE_MAP[i][0]) { const [p0, t0] = LEDGE_MAP[i - 1], [p1, t1] = LEDGE_MAP[i]; return t0 + (t1 - t0) * (p - p0) / (p1 - p0); }
  return LEDGE_MAP[LEDGE_MAP.length - 1][1];
}

// ---- 千鈞一髮 ----
// 預估這一擊會不會讓對方出局或飛到很難回來的位置（不考慮回場操作）
function predictDanger(t) {
  let x = t.x, z = t.z, y = t.y, vx = t.vx, vz = t.vz, vy = t.vy, hs = t.hitstun;
  const h = 1 / 60, T = hs + 0.35;
  for (let tt = 0; tt < T; tt += h) {
    const d = Math.exp(-(hs > 0 ? 0.55 : 2.2) * h);
    vx *= d; vz *= d; vy = Math.max(-MAX_FALL, vy - P.airG * h);
    x += vx * h; z += vz * h; y += vy * h; hs -= h;
    if (y <= 0 && vy < 0 && rhombus(x, z) <= 1) return false;          // 會落回平台
    if (outOfBounds(x, y, z)) return true;
  }
  return rhombus(x, z) > 1 && (edgeDist(x, z) < -5.5 || y < -4);
}
const flashEl = document.getElementById('flash'), vigEl = document.getElementById('vig');
function saved(f) {                       // 救回來了：畫面閃白、角色身邊一圈光
  f.closeCall = false;
  flashEl.style.transition = 'none'; flashEl.style.opacity = 0.55;
  requestAnimationFrame(() => { flashEl.style.transition = ''; flashEl.style.opacity = 0; });
  for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; puff(f.x, f.y + 1, f.z, { color: 0xffffff, size: 0.12, life: 0.45, grow: 1, vx: Math.cos(a) * 4, vy: 1.5, vz: Math.sin(a) * 4 }); }
}

function ko(f) {
  spark(f.x, Math.max(f.y, -2) + 1, f.z, 14, f.accent);
  for (let i = 0; i < 10; i++) puff(f.x, f.y + 1, f.z, { color: f.accent, size: 0.3, life: 0.6, grow: 3, vy: 6 + Math.random() * 8, vx: (Math.random() - 0.5) * 3, vz: (Math.random() - 0.5) * 3 });
  shake = 0.8;
  if (f.move && f.move.id === 'hold') releaseGrab(f);
  if (f.grabbedBy) { f.grabbedBy.move = null; f.grabbedBy = null; }
  f.move = null; f.roll = null; f.dodge = null; f.ledge = null; f.hitstun = 0; f.dizzy = 0; f.shielding = false;
  f.vx = f.vz = f.vy = 0;
  f.dead = 999;                          // 這一局不再出現，等下一局重新站上平台
  if (game.state === 'play') {           // 先掉下去的人輸這一局
    f.opp.wins++;
    game.state = 'roundEnd'; game.t = 0; game.roundWinner = f.opp;
    slowT = 0.9;
  }
}
function respawn(f) {}

function turnTo(f, target, rate, dt) {
  let dy = target - f.yaw;
  dy = Math.atan2(Math.sin(dy), Math.cos(dy));
  f.yaw += dy * Math.min(1, dt * rate);
}

function stepFighter(f, c, dt, active) {
  const o = f.opp;
  for (const k of ['invuln', 'lag', 'shieldStun', 'ledgeCd']) f[k] = Math.max(0, f[k] - dt);
  if (f.out) return;
  if (f.dead > 0) { f.dead -= dt; if (f.dead <= 0) respawn(f); return; }
  if (game.state === 'intro') {
    if (f.introDelay > 0) { f.introDelay -= dt; f.vy = 0; return; }   // 錯開一點點落下
    if (f.ground) f.introT += dt;
  }
  if (f.grabbedBy) {                     // 被抓住：固定在對方身前
    const g = f.grabbedBy;
    f.x = g.x + Math.sin(g.yaw) * 0.8; f.z = g.z + Math.cos(g.yaw) * 0.8; f.y = g.y + 0.15;
    f.vx = f.vz = f.vy = 0; f.yaw = g.yaw + Math.PI; f.ground = false;
    return;
  }

  // ---- 掛在邊緣 ----
  if (f.ledge) {
    const L = f.ledge;
    L.t += dt * (L.climb ? 1 : ledgeClock); f.vx = f.vz = f.vy = 0; f.yaw = Math.atan2(L.nx, L.nz);
    if (L.climb) {                       // 爬上平台（全程無敵）
      L.ct += dt;
      const dur = CLIMB_DUR[L.getup || 'up'];
      const p = Math.min(1, L.ct / dur), e = p * p * (3 - 2 * p);
      if (f.model) { f.x = L.hx; f.z = L.hz; f.y = LEDGE_Y; }    // 骨架人物：身體由爬上來的動作帶上去，結束時才移到平台上
      else { f.x = L.hx + (L.ix - L.hx) * e; f.z = L.hz + (L.iz - L.hz) * e; f.y = LEDGE_Y * (1 - Math.min(1, p * 1.6)); }
      if (p >= 1) {
        f.ledge = null; f.y = 0; f.ground = true; f.ledgeCount = 0;
        if (f.model) {                   // 移到動作結束時身體所在的位置：站起來 → 平台內 1.08；出擊、翻滾 → 剛爬到邊緣
          const k = L.getup ? 0.68 : 1.15;   // 對準動作結束時身體實際所在的位置（爬上來的動作本身會往前移）
          f.x = L.hx + (L.ix - L.hx) * k; f.z = L.hz + (L.iz - L.hz) * k;
        }
        if (L.getup === 'atk') startMove(f, 'getupAtk');                       // D：上來的同時出一擊
        else if (L.getup === 'roll') f.roll = { t: 0, dx: L.nx, dz: L.nz };    // S：翻滾到平台內側
        else f.lag = 0.14;                                                     // 一般爬上來：有短暫空檔
      }
      return;
    }
    // 抓到的瞬間平滑移到掛邊位置
    const g = Math.min(1, L.t / 0.1);
    f.x = L.sx + (L.hx - L.sx) * g; f.z = L.sz + (L.hz - L.sz) * g; f.y = L.sy + (LEDGE_Y - L.sy) * g;
    if (!active) return;
    const inward = c.mx * L.nx + c.mz * L.nz;
    // 掛住後要等 ledgeWait 秒才能上來：對手有機會把人震下去，掛著的人也有時間決定要怎麼上來
    const ready = L.t >= P.ledgeWait;
    if (ready && !L.readyFx) { L.readyFx = true; puff(L.hx, 0.15, L.hz, { size: 0.12, life: 0.3, grow: 7, opacity: 0.8 }); }
    // 等待期間按下的 W／D／S 會先記住（最後按的算數），時間一到立刻執行；按下時手邊閃一下表示有收到
    const pick = c.take('jump') ? 'jump' : c.take('atk') ? 'atk' : c.take('roll') ? 'roll' : null;
    if (pick) { L.queue = pick; if (!ready) puff(L.hx, 0.2, L.hz, { color: 0xffe9a8, size: 0.1, life: 0.22, grow: 6, opacity: 0.9 }); }
    // 攀爬時間內角色一邊往上爬（可被震下）；時間到就執行記住的按鍵，沒有按就自動站上平台
    if (ready && L.queue === 'jump') {   // W：從邊緣跳上來
      releaseLedgeVisual(f);
      f.ledge = null; f.ledgeCd = 0.5; f.y = Math.max(f.y, LEDGE_Y) + 0.01;
      f.vy = P.jumpPower * 1.1; f.vx = L.nx * 2.5; f.vz = L.nz * 2.5;
    } else if (ready) { L.climb = true; L.ct = 0; L.getup = L.queue === 'atk' ? 'atk' : L.queue === 'roll' ? 'roll' : null; }
    else if (L.t > 0.25 && inward < -0.5) { releaseLedgeVisual(f); f.ledge = null; f.ledgeCd = 0.6; f.vy = -1; }   // 往外按：放手（隨時可以）
    return;
  }

  const stunned = f.hitstun > 0 || f.dizzy > 0;
  f.hitstun = Math.max(0, f.hitstun - dt);
  f.dizzy = Math.max(0, f.dizzy - dt);
  let ix = 0, iz = 0;

  // ---- 防禦 ----
  const wasShield = f.shielding;
  f.shielding = false;
  if (f.shieldStun > 0 && wasShield) f.shielding = true;
  else if (active && !stunned && !f.move && !f.roll && f.ground && f.lag <= 0 && c.shieldHeld) f.shielding = true;
  // 防禦（按住 S）：只能在地上、不能移動；沒有耐久值（D 系列會直接打穿）；放開後有 0.1 秒空檔
  if (f.shielding) {
    if (f.shieldStun <= 0 && c.take('roll')) {   // 防禦中連按方向 = 翻滾
      let dx = c.rollDir ? c.rollDir.x : c.mx, dz = c.rollDir ? c.rollDir.z : c.mz, l = Math.hypot(dx, dz);
      if (l < 0.3) { dx = f.x - o.x; dz = f.z - o.z; l = Math.hypot(dx, dz) || 1; }
      f.roll = { t: 0, dx: dx / l, dz: dz / l }; f.shielding = false;
    }
  } else if (wasShield && !f.roll && !f.move && f.ground) f.lag = Math.max(f.lag, 0.1);

  // ---- 可自由行動時：移動與出招 ----
  const free = active && !stunned && !f.move && !f.roll && !f.dodge && f.lag <= 0 && !f.shielding;
  if (free) {
    ix = c.mx; iz = c.mz;
    if (f.ground) {
      if (c.take('grab')) startMove(f, 'grab');
      else if (c.take('strong')) startMove(f, 'strong');
      else if (c.take('lunge')) {        // 突進：面向指定方向衝出去
        if (c.lungeDir) f.yaw = Math.atan2(c.lungeDir.x, c.lungeDir.z);
        startMove(f, 'dash');
      }
      else if (c.take('atk')) startMove(f, 'jab1');
      else if (c.take('taunt')) startMove(f, 'taunt');
      else if (c.take('jump')) { f.vy = P.jumpPower; f.ground = false; f.y = 0.001; }
      else if (c.take('roll')) {         // 翻滾閃避：往連按的方向（或正在按的方向）；都沒有就往面朝的方向
        let dx = c.rollDir ? c.rollDir.x : c.mx, dz = c.rollDir ? c.rollDir.z : c.mz, l = Math.hypot(dx, dz);
        if (l < 0.3) { dx = Math.sin(f.yaw); dz = Math.cos(f.yaw); l = 1; }
        f.roll = { t: 0, dx: dx / l, dz: dz / l };
        ix = iz = 0;
      }
    } else if (!f.helpless) {
      if (c.take('strong')) startMove(f, 'slam');
      else if (c.take('atk')) startMove(f, 'air');
      else if (c.take('jump')) {         // 空中再按一次跳躍鍵 = 上升技（落地或抓邊後才能再用）
        if (!f.specUsed) { startMove(f, 'upSpec'); puff(f.x, f.y, f.z, { size: 0.3, life: 0.25, grow: 5, opacity: 0.5 }); }
      }
    }
  } else if (active && !stunned && !f.ground && (f.helpless || (f.move && f.move.id !== 'slam') || f.dodge)) {
    ix = c.mx; iz = c.mz;                // 空中出招時仍可左右飄移
  }
  if (f.helpless) { ix *= 0.7; iz *= 0.7; }

  if (f.move) stepMove(f, c, dt);
  if (f.dodge) { f.dodge.t += dt; if (f.dodge.t >= 0.4) f.dodge = null; }

  // ---- 面向：空閒時自動面向對手 ----
  if (!f.move && !stunned && !f.roll && o.dead <= 0 && !o.out) turnTo(f, Math.atan2(o.x - f.x, o.z - f.z), 14, dt);

  // ---- 移動積分 ----
  const px = f.x, pz = f.z, py = f.y;
  if (f.roll) {                          // 翻滾：固定路徑、中段無敵
    const r = f.roll; r.t += dt;
    const s = 14 * Math.max(0, 1 - r.t / 0.38);
    f.vx = r.dx * s; f.vz = r.dz * s;
    if (r.t >= 0.38) { f.roll = null; f.lag = 0.14; f.vx = f.vz = 0; }
  } else if (f.ground) {
    const [skx, skz] = sinkAt(f.x, f.z);  // 角落塌陷時被往那一角拉
    const ax = ix * P.accel - P.gravity * Math.sin(tilt.z) + skx * P.collapsePull;
    const az = iz * P.accel + P.gravity * Math.sin(tilt.x) + skz * P.collapsePull;
    f.vx += ax * dt; f.vz += az * dt;
    const d = Math.exp(-(f.hitstun > 0 ? 2 : P.damping) * dt);
    f.vx *= d; f.vz *= d;
  } else {
    f.vx += ix * P.accel * P.airControl * dt; f.vz += iz * P.accel * P.airControl * dt;
    const d = Math.exp(-(f.hitstun > 0 ? 0.55 : 2.2) * dt);
    f.vx *= d; f.vz *= d;
    f.vy -= P.airG * dt;
    const slamming = f.move && f.move.id === 'slam' && f.move.phase === 'active';
    if (f.vy < -MAX_FALL && !slamming) f.vy = -MAX_FALL;
  }
  f.x += f.vx * dt; f.z += f.vz * dt;
  if (!f.ground) f.y += f.vy * dt;

  const k2 = rhombus(f.x, f.z);
  if (f.ground) {
    if (k2 > 1) {
      // 出招、翻滾、防禦中不會自己滑出平台；一般走動或被打退則會掉下去
      if ((f.roll || f.shielding || f.move) && f.hitstun <= 0) { f.x = px; f.z = pz; f.vx = f.vz = 0; }
      else if (f.hitstun <= 0 && f.edgeHold < EDGE_HOLD && Math.hypot(...sinkAt(f.x, f.z)) < 0.05) {
        // 邊緣保護：自己走到邊緣時先停住 0.3 秒（搖晃），繼續往外才會掉下去。被打退、角落塌陷的拉力不保護
        // 只有「按著往外」才會累積保護時間；只是被斜坡推過來、沒在操作時，就一直停在邊緣
        const ol = Math.hypot(f.x, f.z) || 1;
        if (f.edgeHold === 0 || (ix * f.x + iz * f.z) / ol > 0.3) f.edgeHold += dt;
        const sc = 0.999 / k2; f.x *= sc; f.z *= sc;
        const l = Math.hypot(f.x, f.z) || 1, nx = f.x / l, nz = f.z / l, vn = f.vx * nx + f.vz * nz;
        if (vn > 0) { f.vx -= vn * nx; f.vz -= vn * nz; }
      }
      else { f.ground = false; f.y = 0; f.vy = Math.min(f.vy, 0); f.edgeHold = 0; }
    } else if (f.edgeHold > 0 && k2 > 0.985) {
      // 還貼在邊緣並持續往外推：保護時間繼續倒數（不然每次被擋住之間的空檔會讓保護拖太久）
      const l = Math.hypot(f.x, f.z) || 1;
      if ((ix * f.x + iz * f.z) / l > 0.3) f.edgeHold += dt;
    } else if (k2 < 0.94) f.edgeHold = 0;        // 離開邊緣後重新計算
  } else {
    if (f.y <= 0 && py >= 0 && k2 <= 1 && f.vy <= 0) land(f);
    else if (f.y < 0 && k2 < 1) {        // 從側面或下方撞到平台：推回邊緣外
      const s = 1.001 / k2; f.x *= s; f.z *= s;
      const l = Math.hypot(f.x, f.z) || 1, nx = f.x / l, nz = f.z / l, vn = f.vx * nx + f.vz * nz;
      if (vn < 0) { f.vx -= vn * nx; f.vz -= vn * nz; }
    }
    if (active || game.state === 'over') tryLedge(f, dt);
  }

  // 被打飛時的殘影
  if (f.hitstun > 0 && Math.hypot(f.vx, f.vy, f.vz) > 8) {
    f.trailT -= dt;
    if (f.trailT <= 0) { f.trailT = 0.03; puff(f.x, f.y + 1, f.z, { size: 0.22, life: 0.35, grow: 2.5, opacity: 0.45 }); }
  }

  // ---- 出界 ----
  if (outOfBounds(f.x, f.y, f.z)) ko(f);
}

function pushApart(a, b) {               // 身體互相擠開（不交換速度）
  if (a.dead > 0 || b.dead > 0 || a.out || b.out || a.grabbedBy || b.grabbedBy || a.roll || b.roll || a.ledge || b.ledge) return;
  if (Math.abs(a.y - b.y) > 1.2) return;
  let dx = b.x - a.x, dz = b.z - a.z;
  const dist = Math.hypot(dx, dz);
  if (dist >= 2 * BODY_R || dist < 1e-4) return;
  dx /= dist; dz /= dist;
  const o = (2 * BODY_R - dist) / 2;
  a.x -= dx * o; a.z -= dz * o; b.x += dx * o; b.z += dz * o;
}

// =====================================================================
// 比賽流程
// =====================================================================
const msgEl = document.getElementById('msg');
function showMsg(t) { msgEl.textContent = t; msgEl.style.opacity = t ? 1 : 0; }
const game = { state: 'count', t: 0, round: 0, winner: null, roundWinner: null };

function resetFighter(f, side) {
  Object.assign(f, {
    vx: 0, vz: 0, vy: 0, y: 0, ground: true, pct: 0, out: false, dead: 0,
    airJumps: 1, specUsed: false, dodgeUsed: false, helpless: false, move: null, hitstun: 0, dizzy: 0, lag: 0, invuln: 0,
    shield: 100, shielding: false, shieldStun: 0, roll: null, dodge: null, ledge: null, ledgeCd: 0, grabbedBy: null,
    spin: 0, hitT: 0, landT: 0, edgeHold: 0, ledgeCount: 0, closeCall: false,
  });
  [f.x, f.z] = fromUV(side * 3, 0);       // 每局開始：左右分開站
  f.yaw = Math.atan2(-f.x, -f.z);
}
// 每一局：雙方回到起始位置，短暫 READY 後開打
function startRound() {
  resetFighter(player, -1); resetFighter(cpu, 1);
  Object.assign(tilt, { x: 0, z: 0, vx: 0, vz: 0, y: 0, vy: 0 });
  resetBearers();
  Object.assign(ai, { think: 0.5, shieldT: 0, chargeT: 0, roll: null, jabs: 0, buf: {} });
  human.buf = {};
  game.round++;
  game.state = 'intro'; game.t = 0; game.roundWinner = null;
  for (const f of fighters) {                // 從高處落下
    f.y = INTRO.height; f.vy = 0; f.ground = false; f.introT = 0;
    f.introDelay = f === cpu ? INTRO.cpuDelay : 0;
  }
  slowT = 0; hitStop = 0;
}
function startMatch() {
  player.wins = 0; cpu.wins = 0;
  game.round = 0; game.winner = null;
  startRound();
  setPaused(false);
}
function endMatch(winner) {
  if (game.state === 'over') return;
  game.state = 'over'; game.winner = winner; game.t = 0;
}
function updateGame(dt) {
  if (game.state === 'intro') {             // 兩人都落地、站穩之後才開始
    game.t += dt; showMsg('');
    const pullLen = rigAssets.clips.pull ? rigAssets.clips.pull.duration / INTRO.pullSpeed : 0.6;
    const done = fighters.every(f => f.ground && f.introT >= INTRO.smash + pullLen + INTRO.after);
    if (done || game.t > INTRO.maxTime) { game.state = 'play'; game.goT = 0.5; }
  } else if (game.state === 'play' && game.goT > 0) {
    game.goT -= dt; showMsg(game.goT > 0 ? 'GO' : '');
  } else if (game.state === 'count') {
    game.t -= dt;
    showMsg(game.t > 0.45 ? 'READY' : 'GO');
    if (game.t <= 0) { game.state = 'play'; showMsg(''); }
  } else if (game.state === 'roundEnd') {
    game.t += dt;
    const w = game.roundWinner;
    showMsg(tr('roundWin')(w === player ? 'you' : 'cpu'));
    if (game.t > 2.2) {
      if (w.wins >= P.roundsToWin) endMatch(w);
      else startRound();
    }
  } else if (game.state === 'over') {
    game.t += dt;
    const w = game.winner;
    showMsg(tr('matchWin')(w === player ? 'you' : 'cpu', player.wins, cpu.wins));
  }
}

// =====================================================================
// 骨架姿勢
// =====================================================================
const clampA = (v, a) => Math.max(-a, Math.min(a, v));
function animateFighter(f, dt) {
  const rig = f.rig, t = performance.now() / 1000;
  if (f.dead > 0 || f.out) { f.mesh.visible = false; return; }
  f.mesh.visible = !(f.invuln > 0 && Math.floor(t * 16) % 2 === 0);   // 無敵時閃爍
  f.mesh.position.set(f.x, f.y, f.z);
  f.mesh.rotation.y = f.yaw;

  const fs = Math.sin(f.yaw), fc = Math.cos(f.yaw);
  const local = (x, z) => [x * fc - z * fs, x * fs + z * fc];   // 平台座標 → [側向, 前方]
  const sp = Math.hypot(f.vx, f.vz);
  f.hitT = Math.max(0, f.hitT - dt * 2.5);
  f.landT = Math.max(0, f.landT - dt * 4);

  // 預設：格鬥架式
  let crouch = 0.2, spread = 0.08, spineX = 0.1, spineZ = 0, spineY = 0, neckX = 0, spinX = 0, spinY = 0;
  const swing = [0, 0], knee = [0, 0];
  const arm = [{ x: -0.75, z: 0.15, el: -1.6 }, { x: -0.55, z: 0.15, el: -1.4 }];
  const both = o => { Object.assign(arm[0], o); Object.assign(arm[1], o); };
  let speed = 16, opacity = 1;
  const m = f.move;

  if (f.grabbedBy) {                          // 被抓住：癱軟
    both({ x: 0.3, z: 0.3, el: -0.3 }); crouch = 0.1; spineX = -0.25; neckX = -0.3;
    swing[0] = 0.2; swing[1] = -0.1;
  } else if (f.ledge) {
    if (f.ledge.climb) { both({ x: -1.2, z: 0.2, el: -1.2 }); crouch = 0.7; spineX = 0.5; }
    else {                                           // 掛在邊緣：雙手高舉、身體懸空
      both({ x: -3.0, z: 0.1, el: -0.1 }); crouch = 0.05; spineX = 0.05;
      if (f.ledge.t < P.ledgeWait) {                 // 還不能上來：雙腳亂踢、掙扎
        swing[0] = Math.sin(t * 9) * 0.45; swing[1] = -swing[0]; knee[0] = knee[1] = 0.35;
      } else {                                       // 可以上來了：收腿準備
        swing[0] = swing[1] = -0.7; knee[0] = knee[1] = 1.2; both({ x: -2.8, z: 0.1, el: -0.6 });
      }
    }
  } else if (f.hitstun > 0) {
    if (!f.ground) {                                 // 被打飛：翻滾、手腳亂揮
      f.spin += dt * 11; spinX = -f.spin;
      for (let i = 0; i < 2; i++) { arm[i] = { x: -1.6 + Math.sin(t * 14 + i * 3) * 0.8, z: 1.0, el: -0.5 }; swing[i] = Math.sin(t * 12 + i * 3) * 0.6; knee[i] = 0.7; }
      crouch = 0.1; speed = 22;
    } else {                                         // 地面受擊：上半身往後甩
      const [hs, hw] = local(f.hitX, f.hitZ);
      spineX += clampA(-hw * 0.1, 0.7); spineZ += clampA(hs * 0.1, 0.6); neckX = clampA(hw * 0.06, 0.4);
      both({ x: -0.4, z: 0.7, el: -0.8 }); crouch = 0.3; speed = 26;
    }
  } else if (f.dizzy > 0) {                          // 破防暈眩：搖晃、雙手下垂
    both({ x: 0.1, z: 0.2, el: -0.2 }); crouch = 0.35; spineX = 0.35; neckX = 0.4;
    spineZ = Math.sin(t * 5) * 0.25; speed = 8;
  } else if (f.roll) {                               // 翻滾：縮成一團轉一圈
    spinX = (f.roll.t / 0.38) * Math.PI * 2;
    both({ x: -1.3, z: -0.3, el: -2.0 }); crouch = 1.0; spineX = 0.6; speed = 30;
  } else if (f.dodge) {                              // 空中閃避：縮身、半透明
    both({ x: -1.0, z: -0.3, el: -1.9 }); swing[0] = swing[1] = -0.8; knee[0] = knee[1] = 1.4;
    spinY = f.dodge.t / 0.4 * Math.PI * 2; opacity = 0.45; speed = 26;
  } else if (m) {
    speed = 30;
    const act = m.phase === 'active', pre = m.phase === 'startup' || m.phase === 'charge';
    if (m.id === 'jab1' || m.id === 'jab2') {        // 直拳：左右交替
      const i = m.id === 'jab1' ? 0 : 1;
      arm[i] = pre ? { x: -0.2, z: 0.2, el: -2.2 } : act ? { x: -1.55, z: -0.05, el: -0.05 } : { x: -1.2, z: 0, el: -0.7 };
      spineY = (i ? 1 : -1) * (pre ? 0.3 : -0.45); spineX = 0.2;
      swing[i] = -0.3; swing[1 - i] = 0.25;
    } else if (m.id === 'jab3') {                    // 第三段：前踢
      swing[0] = pre ? 0.3 : act ? -1.5 : -0.7; knee[0] = pre ? 1.2 : 0.1;
      spineX = act ? -0.25 : 0.1; both({ x: -0.5, z: 0.5, el: -1.4 });
    } else if (m.id === 'getupAtk') {                // 爬上來的掃擊
      spineX = 0.5; spineY = act ? -0.6 : 0.4; crouch = 0.45;
      arm[0] = { x: -1.4, z: act ? -0.5 : 0.9, el: -0.2 }; arm[1] = { x: -0.4, z: 0.4, el: -1.2 };
    } else if (m.id === 'dash') {                    // 衝刺攻擊：肩撞
      spineX = 0.75; spineY = 0.5; crouch = 0.35;
      arm[0] = { x: -1.2, z: -0.5, el: -1.9 }; arm[1] = { x: 0.6, z: 0.3, el: -0.6 };
      swing[0] = -0.8; knee[0] = 0.3; swing[1] = 0.6;
    } else if (m.id === 'strong') {
      if (pre) {                                     // 蓄力：雙手後拉、身體下沉並顫抖
        const j = m.phase === 'charge' ? Math.sin(t * 60) * 0.04 * (1 + m.charge) : 0;
        both({ x: 0.5 + j, z: 0.25, el: -2.0 }); crouch = 0.5 + m.charge * 0.15; spineX = -0.2 + j; spread = 0.2;
      } else {                                       // 出手：雙掌前推
        both({ x: -1.55, z: -0.1, el: -0.05 }); spineX = act ? 0.65 : 0.4; crouch = 0.3;
        swing[0] = -0.8; knee[0] = 0.3; swing[1] = 0.6;
      }
    } else if (m.id === 'air') {                     // 空中迴旋踢
      spinY = act ? m.pt / m.def.active * Math.PI * 2 : 0;
      swing[0] = -1.3; knee[0] = 0.1; swing[1] = 0.7; knee[1] = 0.9;
      both({ x: -0.3, z: 1.3, el: -0.3 });
    } else if (m.id === 'slam') {
      if (pre) { both({ x: -2.6, z: 0.3, el: -0.6 }); swing[0] = swing[1] = -1.0; knee[0] = knee[1] = 1.6; }
      else if (act) { both({ x: -2.9, z: 0.25, el: -0.1 }); crouch = 0; spineX = -0.05; }        // 雙腳併攏下墜
      else { both({ x: -0.9, z: 0.4, el: -0.3 }); crouch = 0.85; spineX = 0.5; spread = 0.25; }   // 落地重蹲
    } else if (m.id === 'upSpec') {                  // 上升技：單手上勾、旋轉上升
      arm[0] = { x: -3.0, z: 0.05, el: -0.05 }; arm[1] = { x: 0.3, z: 0.3, el: -0.8 };
      swing[0] = 0.2; swing[1] = -0.5; knee[1] = 0.9; crouch = 0;
      spinY = act ? m.pt / m.def.active * Math.PI * 4 : 0;
    } else if (m.id === 'grab') {                    // 抓取：雙手往前撲
      both(pre ? { x: -1.0, z: 0.7, el: -0.6 } : { x: -1.45, z: act ? 0.1 : 0.4, el: -0.3 });
      spineX = 0.45; swing[0] = -0.5; swing[1] = 0.3;
    } else if (m.id === 'hold') {
      both({ x: -1.35, z: 0.05, el: -0.5 }); spineX = 0.2; crouch = 0.3; spread = 0.18;
    } else if (m.id === 'throwRec') {
      both({ x: -1.7, z: 0.2, el: -0.1 }); spineX = 0.55; swing[0] = -0.7; swing[1] = 0.5;
    }
  } else if (f.shielding) {                          // 防禦：蹲低、雙臂交叉
    both({ x: -1.2, z: -0.4, el: -1.6 }); crouch = 0.55; spread = 0.26; spineX = 0.25; neckX = 0.15; speed = 24;
  } else if (!f.ground) {
    if (f.helpless) { both({ x: -0.3, z: 0.6, el: -0.4 }); swing[0] = -0.2; swing[1] = 0.2; knee[0] = knee[1] = 0.5; spineX = -0.1; }
    else {
      const rising = f.vy > 0;                       // 上升收腿、下降伸腳
      swing[0] = rising ? -1.0 : -0.3; swing[1] = rising ? -0.5 : 0.1;
      knee[0] = rising ? 1.5 : 0.5; knee[1] = rising ? 1.1 : 0.4;
      both({ x: rising ? -1.9 : -1.1, z: 0.5, el: -0.6 }); crouch = 0; spineX = 0.12;
    }
  } else {
    // 走動：依實際移動方向擺腿（面向對手時可能是後退或橫移）
    const [vs, vw] = local(f.vx, f.vz);
    const amp = Math.min(1, sp / 6);
    f.walk += sp * dt * 2.2 * (vw < -0.5 ? -1 : 1);
    swing[0] = Math.sin(f.walk) * 0.65 * amp; swing[1] = -swing[0];
    knee[0] = Math.max(0, -Math.cos(f.walk)) * 0.9 * amp;
    knee[1] = Math.max(0, Math.cos(f.walk)) * 0.9 * amp;
    arm[0].x += swing[1] * 0.4; arm[1].x += swing[0] * 0.4;
    spineX += clampA(vw * 0.03, 0.3); spineZ -= clampA(vs * 0.04, 0.3);
    spineX += Math.sin(t * 2.2 + f.x) * 0.02;
    if (f.lag > 0) crouch += 0.2;
    // 靠近邊緣且沒在移動：揮手平衡
    const ed = edgeDist(f.x, f.z);
    if (f.edgeHold > 0 || (ed < 0.6 && sp < 2)) {
      const w = f.edgeHold > 0 ? 1 : (0.6 - ed) / 0.6;
      if (f.edgeHold > 0) { spineX -= 0.35; crouch += 0.15; }      // 邊緣保護中：身體後仰、搖晃
      for (let i = 0; i < 2; i++) { arm[i].x = -1.3 + Math.sin(t * 16 + i * Math.PI) * 1.3 * w; arm[i].z = 0.4 + 0.8 * w; arm[i].el = -0.4; }
    }
  }

  if (f.ground && !f.roll) {
    // 平台傾斜時往高處傾；落地時屈膝緩衝
    const [us, uw] = local(Math.sin(tilt.z), -Math.sin(tilt.x));
    spineX += uw * 1.2; spineZ -= us * 1.2;
    crouch += f.landT * 0.45;
  }
  if (!(f.hitstun > 0 && !f.ground)) f.spin = 0;

  // ---- 套用 ----
  const k = 1 - Math.exp(-dt * speed);
  const to = (obj, prop, v) => { obj[prop] += (v - obj[prop]) * k; };
  let hipY = 0;
  rig.legs.forEach((l, i) => {
    to(l.thigh.rotation, 'x', -crouch + swing[i]);
    to(l.thigh.rotation, 'z', l.s * spread);
    to(l.shin.rotation, 'x', 2 * crouch + knee[i]);
    l.foot.rotation.x = -(l.thigh.rotation.x + l.shin.rotation.x);
    const a1 = l.thigh.rotation.x, a2 = a1 + l.shin.rotation.x;
    hipY = Math.max(hipY, LEG * Math.cos(a1) * Math.cos(l.thigh.rotation.z) + LEG * Math.cos(a2));
  });
  rig.hips.position.y = FOOT_H + hipY - BODY_Y;
  rig.body.rotation.x = spinX; rig.body.rotation.y = spinY;
  to(rig.spine.rotation, 'x', clampA(spineX, 1.1));
  to(rig.spine.rotation, 'z', clampA(spineZ, 0.8));
  to(rig.spine.rotation, 'y', spineY);
  to(rig.neck.rotation, 'x', clampA(neckX - spineX * 0.4, 0.8));
  rig.arms.forEach((a, i) => {
    to(a.shoulder.rotation, 'x', arm[i].x);
    to(a.shoulder.rotation, 'z', a.s * arm[i].z);
    to(a.elbow.rotation, 'x', arm[i].el);
  });
  // 蓄力過半（可以硬吃 D）時身體發出金光
  const glow = isArmored(f) ? 0.35 + 0.15 * Math.sin(t * 30) : 0;
  if (glow !== f.glow) { f.glow = glow; for (const mt of f.mats) { mt.emissive.setHex(0xffb040); mt.emissiveIntensity = glow; } }
  rig.bubble.visible = f.shielding;
  if (f.shielding) rig.bubble.material.opacity = f.shieldStun > 0 ? 0.35 : 0.16;
  if (f.shielding) rig.bubble.scale.setScalar(0.6 + 0.5 * Math.max(0, f.shield) / 100);
  if (f.model) updateModel(f, dt, spinX, spinY);
  if (f.opacity !== opacity) {           // 空中閃避時半透明
    f.opacity = opacity;
    rig.body.traverse(o => { if (o.isMesh) { o.material.transparent = opacity < 1; o.material.opacity = opacity; } });
  }
}

// =====================================================================
// 骨架人物（Mixamo）
//   character.fbx：人物本體（附帶 Body Block 動作）；idle / punch / hit：只有動作。
//   載入完成前（或載入失敗時）沿用程式組成的方塊人。位移由遊戲物理控制，所以把動作的水平位移鎖住。
// =====================================================================
const CHAR_FILES = ['gi', 'character'];   // 角色模型檔（ 裡），依序嘗試
const rigAssets = { ready: false, base: null, clips: {}, impact: {}, scale: 1, missing: [] };
// 動作檔對照表。lockY：連上下位移也鎖住（跳躍、下墜、爬上來的高度由遊戲物理控制）
const RIG_CLIPS = {
  idle:   { file: 'idle' },          // Fighting Idle
  run:    { file: 'run' },           // Running
  jab1:   { file: 'jab1',  impact: 'reach' },   // Punching
  // win：這個動作要播的區段（原檔秒數）：start 起手開始、impact 命中、end 收手；amp：幅度放大的額外倍率
  jab2:   { file: 'jab2',  win: { start: 0.08, impact: 0.5, end: 0.95 }, amp: 1.6 },   // Hook：最大轉身在 0.5 秒
  jab3:   { file: 'jab3',  impact: 'reach' },   // Side Kick
  lunge:  { file: 'lunge', impact: 'reach' },   // Mutant Swiping
  strong: { file: 'strong', impact: 'reach' },  // Uppercut（備用：買來的 Push Punch R 載入失敗時才用）
  air:    { file: 'air',   win: { start: 0.28, impact: 0.48, end: 1.58 }, amp: 1.4, ampLegsOnly: true, lockY: true },   // Hurricane Kick：連續旋轉，播約一圈半
  slam:   { file: 'slam',  custom: true },          // Jump Attack（另外處理，見 buildSlamClip）
  jump:   { file: 'jump',  lockY: true },       // Jumping Up
  roll:   { file: 'roll' },          // Sprinting Forward Roll
  hit:    { file: 'hit' },           // Hit Reaction
  knock:  { file: 'knock', lockY: true },       // Falling Back
  pull:   { file: 'pull' },
  taunt:  { file: 'taunt' },                     // Silly Dancing：空白鍵嘲諷                      // Sumo High Pull：開場落地後蹲低站穩
  climb:  { file: 'climb', keepRoot: true },     // Freehang Climb：保留身體往上、往前的位移
};
function lockRoot(clip, lockY, keepRoot) {   // 動作原地播放：鎖住髖部的水平位移（必要時連上下也鎖）；keepRoot 只鎖左右
  for (const tr of clip.tracks) {
    if (/Hips\.position$/.test(tr.name)) {
      const v = tr.values;
      for (let i = 3; i < v.length; i += 3) { v[i] = v[0]; if (keepRoot) continue; v[i + 2] = v[2]; if (lockY) v[i + 1] = v[1]; }
    }
  }
  return clip;
}
// 找出動作的「命中瞬間」，用來和招式的判定時間對齊。
//   reach：手或腳伸到最前面的時間點；low：雙手揮到最低的時間點（往下砸的動作）
function findImpact(clip, mode) {
  const tmp = SkeletonUtils.clone(rigAssets.base);
  const mixer = new THREE.AnimationMixer(tmp);
  mixer.clipAction(clip).play();
  const hips = tmp.getObjectByName('mixamorigHips');
  const pick = names => names.map(n => tmp.getObjectByName(n)).filter(Boolean);
  const hands = pick(['mixamorigRightHand', 'mixamorigLeftHand']);
  const ends = hands.concat(pick(['mixamorigRightFoot', 'mixamorigLeftFoot']));
  const a = new THREE.Vector3(), b = new THREE.Vector3();
  let best = -Infinity, bt = 0;
  for (let t = 0; t < clip.duration; t += 1 / 60) {
    mixer.setTime(t); tmp.updateMatrixWorld(true);
    hips.getWorldPosition(b);
    if (mode === 'low') { for (const h of hands) { const v = -(h.getWorldPosition(a).y - b.y); if (v > best) { best = v; bt = t; } } }
    else for (const h of ends) { const v = h.getWorldPosition(a).z - b.z; if (v > best) { best = v; bt = t; } }
  }
  return bt;
}
// Jump Attack：檔案開頭 0.45 秒是錯誤資料（身體在別的位置），而且原本是「原地起跳 → 往前跳 → 落地」。
// 只取空中到落地的部分，並重新整理髖部位移：
//   空中：高度固定在站立高度（實際高度交給遊戲物理），前後左右固定在原點 → 不會跑位
//   落地之後：保留原本的下蹲（重擊落地的重量感）
const SLAM_SRC = { start: 1.0, apex: 1.2, impact: 1.68, end: 2.5 };   // 原檔的時間點（秒）
function buildSlamClip(raw, ref) {
  const c = THREE.AnimationUtils.subclip(raw, 'slam', Math.round(SLAM_SRC.start * 30), Math.round(SLAM_SRC.end * 30), 30);
  const imp = SLAM_SRC.impact - SLAM_SRC.start;
  for (const tr of c.tracks) {
    if (!/Hips\.position$/.test(tr.name)) continue;
    const v = tr.values;
    for (let i = 0; i < tr.times.length; i++) {
      const t = tr.times[i];
      v[i * 3] = ref.x; v[i * 3 + 2] = ref.z;
      const w = Math.min(1, Math.max(0, (t - (imp - 0.08)) / 0.1));   // 落地前 0.08 秒開始接回原本的下蹲
      v[i * 3 + 1] = ref.y * (1 - w) + v[i * 3 + 1] * w;
    }
  }
  rigAssets.slamT = { apex: SLAM_SRC.apex - SLAM_SRC.start, impact: imp, end: c.duration };
  return c;
}
// ---- 把其他骨架（Reallusion / ActorCore）的動作轉到 Mixamo 骨架 ----
// 做法：兩邊都以第一格的 T 字站姿為基準，算出每根骨頭「相對於 T 字站姿」的世界旋轉，再套到對應的 Mixamo 骨頭上
const CC_TO_MIXAMO = {
  Hip: 'Hips', Waist: 'Spine', Spine01: 'Spine1', Spine02: 'Spine2', NeckTwist01: 'Neck', Head: 'Head',
  L_Clavicle: 'LeftShoulder', L_Upperarm: 'LeftArm', L_Forearm: 'LeftForeArm', L_Hand: 'LeftHand',
  R_Clavicle: 'RightShoulder', R_Upperarm: 'RightArm', R_Forearm: 'RightForeArm', R_Hand: 'RightHand',
  L_Thigh: 'LeftUpLeg', L_Calf: 'LeftLeg', L_Foot: 'LeftFoot', L_ToeBase: 'LeftToeBase',
  R_Thigh: 'RightUpLeg', R_Calf: 'RightLeg', R_Foot: 'RightFoot', R_ToeBase: 'RightToeBase',
};
for (const s of ['L', 'R']) for (const [cc, mx] of [['Thumb', 'Thumb'], ['Index', 'Index'], ['Mid', 'Middle'], ['Ring', 'Ring'], ['Pinky', 'Pinky']])
  for (let i = 1; i <= 3; i++) CC_TO_MIXAMO[`${s}_${cc}${i}`] = `${s === 'L' ? 'Left' : 'Right'}Hand${mx}${i}`;

function retargetCC(srcObj, srcClip, name, skipFrames = 2) {
  const tgt = SkeletonUtils.clone(rigAssets.base);          // 目標：Mixamo 骨架（未套動作 = T 字站姿）
  tgt.updateMatrixWorld(true);
  const mixer = new THREE.AnimationMixer(srcObj);
  mixer.clipAction(srcClip).play();
  const pairs = [];                                          // 依目標骨架的層級順序（先父後子）
  const seen = new Set();                                    // 人物檔裡有兩套同名骨架：只用第一套（也就是動作實際綁定的那套）
  tgt.traverse(b => {
    if (!b.isBone || seen.has(b.name)) return;
    seen.add(b.name);
    const key = Object.keys(CC_TO_MIXAMO).find(k => 'mixamorig' + CC_TO_MIXAMO[k] === b.name);
    const src = key && srcObj.getObjectByName('CC_Base_' + key);
    if (src) pairs.push({ tgt: b, src });
  });
  const q = () => new THREE.Quaternion(), v = () => new THREE.Vector3();
  // 基準（T 字站姿）：來源第 0 格、目標的預設姿勢
  mixer.setTime(0); srcObj.updateMatrixWorld(true);
  for (const p of pairs) { p.srcRef = p.src.getWorldQuaternion(q()); p.tgtRef = p.tgt.getWorldQuaternion(q()); p.restLocal = p.tgt.quaternion.clone(); }
  // 兩邊的「上方、正前方」可能不同：用髖部→頭（上）與左右肩（側）建立座標系，求出對齊旋轉
  const frame = (o, hips, head, ls, rs) => {
    const up = o.getObjectByName(head).getWorldPosition(v()).sub(o.getObjectByName(hips).getWorldPosition(v())).normalize();
    const side = o.getObjectByName(rs).getWorldPosition(v()).sub(o.getObjectByName(ls).getWorldPosition(v()));
    const fwd = v().crossVectors(up, side).normalize(); side.crossVectors(fwd, up).normalize();
    return new THREE.Matrix4().makeBasis(side, up, fwd);
  };
  const Ms = frame(srcObj, 'CC_Base_Hip', 'CC_Base_Head', 'CC_Base_L_Upperarm', 'CC_Base_R_Upperarm');
  const Mt = frame(tgt, 'mixamorigHips', 'mixamorigHead', 'mixamorigLeftArm', 'mixamorigRightArm');

// =====================================================================
const camMid = new THREE.Vector3(0, 0, 0), camPos = new THREE.Vector3();
let camZoom = 1;
const camFocus = { f: null, t: 0 };
const _v = new THREE.Vector3();
function updateCamera(dt) {
  const pts = fighters.filter(f => !f.out && f.dead <= 0)
    .map(f => platform.localToWorld(_v.set(f.x, Math.max(f.y, -4) + 0.9, f.z).clone()));
  const mid = new THREE.Vector3();
  let spreadW = 0;
  if (pts.length) {
    for (const p of pts) mid.add(p);
    mid.multiplyScalar(1 / pts.length);
    if (pts.length > 1) spreadW = pts[0].distanceTo(pts[1]);
  }
  // 有人在場外（或掛在邊緣）：鏡頭對準兩人中間並拉近；平常最近只拉到 camZoomMin，焦點偏向平台中心
  const off = fighters.some(f => !f.out && f.dead <= 0 && (f.ledge || (!f.ground && (rhombus(f.x, f.z) > 1 || f.y < -0.2))));
  const CAM_REF_W = 30.2;                  // 鏡頭遠近當初是照菱形平台（寬 26.2）調的：以它為基準
  let zoomT, rate = 3.5;
  if (off) { zoomT = Math.max(0.42, Math.min(1.7, (spreadW + 9) / CAM_REF_W)); mid.y -= 0.8; rate = 5; }
  else { zoomT = Math.max(P.camZoomMin, Math.min(1.7, (spreadW + 14) / CAM_REF_W)); mid.multiplyScalar(0.55).add(_v.set(0, -0.6, 0)); }
  // 千鈞一髮：短暫把鏡頭偏向被打飛的人並再拉近一點
  camFocus.t -= dt;
  if (camFocus.t > 0 && camFocus.f && camFocus.f.dead <= 0) {
    const fp = platform.localToWorld(_v.set(camFocus.f.x, Math.max(camFocus.f.y, -4) + 0.9, camFocus.f.z).clone());
    mid.lerp(fp, 0.6); zoomT = Math.max(0.4, zoomT * 0.8); rate = 8;
  }
  vigEl.style.opacity = game.state !== 'play' ? 0 : slowT > 0 ? 1 : (someoneHanging() && P.ledgeSlow < 1 ? 0.6 : 0);
  const k = 1 - Math.exp(-dt * rate);
  camMid.lerp(mid, k);
  camZoom += (zoomT * (0.68 + 0.32 * (platScreenW() + 4) / CAM_REF_W) - camZoom) * k;   // 平台越小鏡頭越近，畫面裡平台的大小維持一樣
  shake = Math.max(0, shake - dt * 2.5);
  camPos.copy(CAM_BASE).multiplyScalar(aspectK * camZoom).add(camMid);
  camera.position.copy(camPos).add(_v.set((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake));
  camera.lookAt(camMid.x, camMid.y + camLookY * camZoom, camMid.z);
}

// =====================================================================
// HUD
// =====================================================================
const cards = fighters.map((f, i) => {
  const el = document.getElementById('card' + i);
  const gauge = el.querySelector('.gauge');
  gauge.innerHTML = Array.from({ length: 10 }, (_, k) => `<span class="${k >= 7 ? 'hi' : k >= 4 ? 'mid' : ''}"></span>`).join('');
  return { f, gauge, cells: [...gauge.children], wins: el.querySelector('.wins'), lastN: -1, lastWins: '' };
});
const timerEl = document.getElementById('timer');
// 受傷值 → 0～10 格（有受傷就至少亮 1 格）
const gaugeCells = f => Math.min(10, Math.ceil(f.pct / GAUGE_STEP - 1e-6));
function updateHud() {
  for (const c of cards) {
    const n = gaugeCells(c.f);
    if (n !== c.lastN) {
      c.lastN = n;
      c.cells.forEach((el, k) => el.classList.toggle('on', k < n));
      c.gauge.classList.toggle('danger', n >= 8);
    }
    const w = `${c.f.wins}/${P.roundsToWin}`;
    if (w !== c.lastWins) {
      c.lastWins = w;
      c.wins.innerHTML = Array.from({ length: P.roundsToWin }, (_, k) => `<span class="${k < c.f.wins ? 'won' : ''}"></span>`).join('');
    }
  }
  const sc = `${player.wins} － ${cpu.wins}`;
  if (timerEl.textContent !== sc) timerEl.textContent = sc;   // 有變才改，避免每格重排版面
}

// =====================================================================
// 暫停、鏡頭按鍵、面板
// =====================================================================
let paused = false;
const pauseEl = document.getElementById('pause');
function setPaused(v) {
  paused = v;
  pauseEl.classList.toggle('on', v);
  msgEl.style.visibility = v ? 'hidden' : '';
  human.buf = {};
}
const camHold = { elev: 0, dist: 0 };
function cameraKeys(dt) {
  const elev = (keys.has('KeyE') ? 1 : 0) - (keys.has('KeyQ') ? 1 : 0) + camHold.elev;
  const dist = (keys.has('KeyX') ? 1 : 0) - (keys.has('KeyZ') ? 1 : 0) + camHold.dist;
  if (!elev && !dist) return;
  P.camY = Math.max(CAM_Y_MIN, Math.min(CAM_Y_MAX, P.camY + elev * 15 * dt));
  P.camDist = Math.round(Math.max(8, Math.min(50, P.camDist + dist * 15 * dt)) * 10) / 10;
  inputs.camDist.value = P.camDist;
  refreshLabels();
  resize();
}

const slidersEl = document.getElementById('sliders');
const inputs = {}, valueEls = {};
const capture = (el, e) => { try { el.setPointerCapture(e.pointerId); } catch {} };
function holdButton(b, axis, dir) {
  b.addEventListener('pointerdown', e => { camHold[axis] = dir; capture(b, e); });
  const stop = () => { camHold[axis] = 0; b.blur(); };
  b.addEventListener('pointerup', stop);
  b.addEventListener('pointercancel', stop);
}
for (const [title, items] of GROUPS) {
  const h = document.createElement('h4'); h.textContent = title; slidersEl.appendChild(h);
  for (const [k, [name, min, max, step]] of Object.entries(items)) {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<label><span>${name}</span><span></span></label>
      <input type="range" min="${min}" max="${max}" step="${step}">`;
    const input = row.querySelector('input');
    valueEls[k] = row.querySelector('label span:last-child');
    input.value = P[k];
    input.addEventListener('input', () => {
      P[k] = +input.value; refreshLabels();
      if (k === 'platW' || k === 'platD' || k === 'thick' || k === 'bearPerEdge') { buildSlab(); buildBearers(); }
      if (k === 'brightness') applyLighting();
      if (k === 'camDist') resize();
      if (k === 'resScale') { renderer.setPixelRatio(Math.min(devicePixelRatio, P.resScale)); resize(); }
    });
    input.addEventListener('keydown', e => e.preventDefault());
    input.addEventListener('pointerup', () => input.blur());
    inputs[k] = input;
    slidersEl.appendChild(row);
  }
  if (title === '畫面') {
    const box = document.createElement('div');
    box.className = 'camBtns';
    for (const [label, dir] of [['＋ 鏡頭拉近（Z）', -1], ['－ 鏡頭拉遠（X）', 1]]) {
      const b = document.createElement('button');
      b.textContent = label;
      holdButton(b, 'dist', dir);
      box.appendChild(b);
    }
    slidersEl.appendChild(box);
  }
}
function refreshLabels() { for (const k in valueEls) valueEls[k].textContent = P[k]; }
document.getElementById('resetParams').addEventListener('click', e => {
  Object.assign(P, DEFAULTS);
  for (const k in inputs) inputs[k].value = P[k];
  refreshLabels(); buildSlab(); buildBearers(); applyLighting(); resize(); e.target.blur();
});
refreshLabels();

function resize() {
  const w = innerWidth, h = innerHeight;
  if (!w || !h) return;                       // 視窗被縮到看不見時（大小 0）先不更新，避免鏡頭比例變成無效值
  renderer.setSize(w, h);
  camera.aspect = w / h;
  updateCamBase();
  aspectK = Math.max(1, 2.0 / camera.aspect);   // 畫面較窄時把鏡頭拉遠
  camera.updateProjectionMatrix();
  updateRail();
}

// 左側鏡頭升降軌
const railTrack = document.querySelector('#camRail .track');
const railThumb = document.querySelector('#camRail .thumb');
const railFill = document.querySelector('#camRail .fill');
const railVal = document.getElementById('camYVal');
function updateRail() {
  const f = (P.camY - CAM_Y_MIN) / (CAM_Y_MAX - CAM_Y_MIN);
  railThumb.style.bottom = `calc(${f * 100}% - 9px)`;
  railFill.style.height = `${f * 100}%`;
  railVal.textContent = P.camY.toFixed(1);
}
function railFromPointer(e) {
  const r = railTrack.getBoundingClientRect();
  const f = Math.max(0, Math.min(1, 1 - (e.clientY - r.top) / r.height));
  P.camY = CAM_Y_MIN + f * (CAM_Y_MAX - CAM_Y_MIN);
  resize();
}
let railDrag = false;
railTrack.addEventListener('pointerdown', e => { railDrag = true; railFromPointer(e); capture(railTrack, e); });
railTrack.addEventListener('pointermove', e => { if (railDrag) railFromPointer(e); });
railTrack.addEventListener('pointerup', () => { railDrag = false; });
railTrack.addEventListener('pointercancel', () => { railDrag = false; });
railTrack.addEventListener('wheel', e => {
  e.preventDefault();
  P.camY = Math.max(CAM_Y_MIN, Math.min(CAM_Y_MAX, P.camY - e.deltaY * 0.02));
  resize();
}, { passive: false });
for (const b of document.querySelectorAll('#camRail button')) holdButton(b, 'elev', +b.dataset.d);

addEventListener('resize', resize);
resize();

// =====================================================================
// 主迴圈（固定 120Hz 物理步長）
// =====================================================================
window.__sumo = { retargetCC, rigAssets, player, cpu, P, game, human, ai, tilt, bearers, corners, camera, platform, MOVES, isPaused: () => paused };   // 除錯用
const STEP = 1 / 120;
let acc = 0, last = performance.now();
startMatch();

// 幀數顯示（F 鍵開關）：每 0.5 秒更新一次平均 FPS 與最慢的一格
const fpsEl = document.getElementById('fps');
if (document.body.dataset.build === 'public') fpsEl.style.display = 'none';   // 朋友版預設不顯示 FPS（按 F 打開）
const fpsStat = { n: 0, t: 0, worst: 0, last: performance.now() };
function updateFps(now) {
  const ms = now - fpsStat.last; fpsStat.last = now;
  fpsStat.n++; fpsStat.t += ms; fpsStat.worst = Math.max(fpsStat.worst, ms);
  if (fpsStat.t >= 500) {
    fpsEl.textContent = `${Math.round(fpsStat.n * 1000 / fpsStat.t)} FPS　${tr('worst')} ${fpsStat.worst.toFixed(0)} ms`;
    fpsStat.n = 0; fpsStat.t = 0; fpsStat.worst = 0;
  }
}
function frame(now) {
  updateFps(now);
  const realDt = Math.min(0.1, (now - last) / 1000);
  last = now;
  cameraKeys(realDt);
  if (!loadDone.shown) {                    // 載入中：先不開始比賽
    const n = (loadDone.rig ? 1 : 0) + (loadDone.bear ? 1 : 0) + (loadDone.mat ? 1 : 0);
    document.querySelector('#loading .bar i').style.width = `${15 + n * 28}%`;
    if (n === 3 || performance.now() - loadDone.t0 > 40000) {
      loadDone.shown = true;
      const el = document.getElementById('loading'); el.style.opacity = 0; setTimeout(() => el.remove(), 600);
      startMatch();
    } else { renderer.render(scene, camera); requestAnimationFrame(frame); return; }
  }
  if (paused) { renderer.render(scene, camera); requestAnimationFrame(frame); return; }

  let dt = realDt;
  if (slowT > 0) { slowT -= realDt; dt *= 0.3; }       // 決勝瞬間慢動作
  else if (game.state === 'play' && someoneHanging()) { dt *= P.ledgeSlow; ledgeClock = 1 / P.ledgeSlow; }   // 有人掛在邊緣：整個遊戲放慢，拉高張力
  else ledgeClock = 1;
  if (hitStop > 0) hitStop -= realDt; else acc += dt;  // 打擊停格
  while (acc >= STEP) {
    const active = game.state === 'play';
    updateHuman(STEP);
    updateAI(STEP);
    stepBearers(STEP);
    stepTilt(STEP);
    stepFighter(player, human, STEP, active);
    stepFighter(cpu, ai, STEP, active);
    pushApart(player, cpu);
    processHits(player, cpu);
    processHits(cpu, player);
    stepFx(STEP);
    acc -= STEP;
  }
  updateGame(dt);
  platform.rotation.set(tilt.x, 0, tilt.z);
  platform.position.y = tilt.y;
  animateBearers(dt);
  for (const f of fighters) { animateFighter(f, dt); updateGrip(f); }
  updateCamera(realDt);
  updateHud();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
